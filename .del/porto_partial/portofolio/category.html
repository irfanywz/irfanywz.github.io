{{ if eq .Params.category "Aplikasi" }}
    <span class="icon-[ri--code-s-slash-line] w-3 h-3"></span>
{{ else if eq .Params.category "Animasi" }}
    <span class="icon-[ri--video-line] w-3 h-3"></span>
{{ else if eq .Params.category "Desain-grafis" }}
    <span class="icon-[ri--palette-line] w-3 h-3"></span>
{{ else if eq .Params.category "IT Support" }}
    <span class="icon-[ri--computer-line] w-3 h-3"></span>
{{ else }}
    <span class="icon-[ri--price-tag-3-line] w-3 h-3"></span>
{{ end }}
{{ .Params.category }}
