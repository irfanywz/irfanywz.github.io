{{ $title := .Get "title" | default "Accordion Item" }}
{{ $isOpen := .Get "open" | default "false" }}

<div class="my-4 overflow-hidden rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shadow-sm" x-data="{ open: {{ $isOpen }} }">
    <!-- Header / Tombol Klik -->
    <button type="button" 
            @click="open = !open" 
            class="w-full flex items-center justify-between px-5 py-3.5 text-left font-semibold text-gray-900 dark:text-white text-sm md:text-base bg-gray-50/50 dark:bg-gray-800/40 hover:bg-gray-100/60 dark:hover:bg-gray-800/80 transition-colors focus:outline-none select-none">
        <span>{{ $title }}</span>
        <span class="icon-[ri--arrow-down-s-line] w-5 h-5 text-gray-500 transform transition-transform duration-200" :class="{ 'rotate-180': open }"></span>
    </button>

    <!-- Konten Body -->
    <div x-show="open" 
         x-cloak 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 -translate-y-1"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 -translate-y-1"
         class="px-5 py-4 border-t border-gray-200 dark:border-gray-800 text-sm text-gray-600 dark:text-gray-300 leading-relaxed">
        {{ .Inner | markdownify }}
    </div>
</div>
