{{ $q := .Get "q" | default "" }}
{{ $a := .Get "a" | default .Inner }}

<div class="my-6 p-5 border border-gray-200 dark:border-gray-800 rounded-2xl bg-white dark:bg-gray-800/50 shadow-sm">
    <div class="flex items-start gap-3 mb-3">
        <span class="w-7 h-7 rounded-lg bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-xs font-bold shrink-0 mt-0.5">Q</span>
        <h3 class="font-bold text-gray-900 dark:text-white text-base leading-snug">{{ $q }}</h3>
    </div>
    <div class="flex items-start gap-3 pl-1">
        <span class="w-6 h-6 rounded-lg bg-gray-100 dark:bg-gray-700/60 text-gray-500 dark:text-gray-400 flex items-center justify-center text-xs font-bold shrink-0 mt-0.5">A</span>
        <div class="flex-1 text-sm text-gray-600 dark:text-gray-300 leading-relaxed">
            {{ markdownify $a }}
        </div>
    </div>
</div>
