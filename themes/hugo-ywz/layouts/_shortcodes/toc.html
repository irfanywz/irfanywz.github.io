{{ if .Page.TableOfContents }}
<div x-data="{ 
    show: false, 
    mobileOpen: false,
    init() {
        // Otomatis salin isi TOC jika modal mobile dibuka
        this.$watch('mobileOpen', value => {
            if (value && this.$refs.mobileTocContainer && this.$refs.desktopTocContent) {
                setTimeout(() => {
                    this.$refs.mobileTocContainer.innerHTML = this.$refs.desktopTocContent.innerHTML;
                }, 10);
            }
        });
    }
}" class="not-prose">

    <!-- 1. Versi Desktop -->
    <div class="hidden md:inline-block my-6 min-w-[300px] max-w-full bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-4 shadow-sm">
        <button @click="show = !show" class="w-full flex items-center justify-between gap-4 font-bold text-gray-900 dark:text-white text-base focus:outline-none group/toc">
            <span class="flex items-center gap-2">
                <span class="icon-[ri--menu-fold-line] w-5 h-5 text-indigo-600 dark:text-indigo-400"></span>
                Daftar Isi Artikel
            </span>
            
            <!-- Indikator Tombol Buka/Tutup dengan Simbol + dan - -->
            <div class="flex items-center gap-1.5 px-2 py-1 rounded-md text-xs font-semibold bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 group-hover/toc:bg-indigo-50 dark:group-hover/toc:bg-indigo-950/50 group-hover/toc:text-indigo-600 dark:group-hover/toc:text-indigo-400 transition-colors">
                <span x-text="show ? 'Tutup' : 'Buka'"></span>
                <span x-show="!show" class="icon-[ri--add-line] w-4 h-4"></span>
                <span x-show="show" x-cloak class="icon-[ri--subtract-line] w-4 h-4"></span>
            </div>
        </button>
        
        <!-- Element yang di-ref untuk dicopy ke mobile -->
        <div x-show="show" x-cloak x-transition x-ref="desktopTocContent" class="mt-4 pt-4 border-t border-gray-200 dark:border-gray-800 text-sm text-gray-600 dark:text-gray-300 [&_ul]:my-1 [&_ul]:list-disc [&_ul]:pl-5 [&_li]:my-1 [&_ul_ul]:my-1 [&_a]:text-gray-600 dark:[&_a]:text-gray-400 [&_a:hover]:text-indigo-600 dark:[&_a:hover]:text-indigo-400 [&_a]:transition-colors">
            {{ .Page.TableOfContents }}
        </div>
    </div>

    <!-- 2. Versi Mobile -->
    <div class="md:hidden">
        <!-- Hidden source container jika di desktop TOC tidak dibuka/dirender -->
        <div x-ref="desktopTocContent" class="hidden">
            {{ .Page.TableOfContents }}
        </div>

        <!-- Tombol Floating Ringkas -->
        <button @click="mobileOpen = true" aria-label="Buka Daftar Isi" class="fixed bottom-20 left-0 z-40 p-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-r-xl shadow-lg transition-transform active:scale-95 focus:outline-none">
            <span class="icon-[ri--list-unordered] w-6 h-6 block"></span>
        </button>

        <!-- Backdrop Gelap -->
        <div x-show="mobileOpen" x-cloak x-transition.opacity class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm" @click="mobileOpen = false"></div>

        <!-- Sheet / Bottom Offcanvas Modal -->
        <div x-show="mobileOpen" 
             x-cloak 
             x-transition:enter="transition ease-out duration-300 transform" 
             x-transition:enter-start="translate-y-full" 
             x-transition:enter-end="translate-y-0" 
             x-transition:leave="transition ease-in duration-200 transform" 
             x-transition:leave-start="translate-y-0" 
             x-transition:leave-end="translate-y-full" 
             class="fixed inset-x-0 bottom-0 z-50 flex flex-col max-h-[80vh] bg-white dark:bg-gray-900 rounded-t-2xl border-t border-gray-200 dark:border-gray-800 shadow-2xl overflow-hidden">
            
            <!-- Sticky Header Offcanvas -->
            <div class="flex items-center justify-between p-5 border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 flex-shrink-0">
                <h3 class="font-bold text-gray-900 dark:text-white flex items-center gap-2 text-base">
                    <span class="icon-[ri--menu-fold-line] w-5 h-5 text-indigo-600 dark:text-indigo-400"></span>
                    Daftar Isi Artikel
                </h3>
                <button @click="mobileOpen = false" class="p-1 text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 focus:outline-none">
                    <span class="icon-[ri--close-line] w-6 h-6"></span>
                </button>
            </div>
            
            <!-- Container Scrollable Khusus Isi TOC -->
            <div class="px-5 pt-4 pb-6 overflow-y-auto flex-grow">
                <div @click="if ($event.target.tagName === 'A') mobileOpen = false" x-ref="mobileTocContainer" class="text-sm text-gray-600 dark:text-gray-300 [&_ul]:my-1 [&_ul]:list-disc [&_ul]:pl-5 [&_li]:my-1 [&_ul_ul]:my-1 [&_a]:text-gray-600 dark:[&_a]:text-gray-400 [&_a:hover]:text-indigo-600 dark:[&_a:hover]:text-indigo-400 [&_a]:transition-colors">
                </div>
            </div>
        </div>
    </div>

</div>
{{ end }}
