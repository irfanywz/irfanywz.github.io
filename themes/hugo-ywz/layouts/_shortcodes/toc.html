{{ if .Page.TableOfContents }}
<div x-data="{ show: false, mobileOpen: false }" class="not-prose">

    <!-- 1. Versi Desktop: Inline (Menyesuaikan panjang teks & bisa toggle) -->
    <div class="hidden md:inline-block my-6 min-w-[280px] max-w-full bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-4 shadow-sm">
        <button @click="show = !show" class="w-full flex items-center justify-between gap-4 font-bold text-gray-900 dark:text-white text-base focus:outline-none">
            <span class="flex items-center gap-2">
                <span class="icon-[ri--menu-fold-line] w-5 h-5 text-indigo-600 dark:text-indigo-400"></span>
                Daftar Isi Artikel
            </span>
            <span class="icon-[ri--arrow-down-s-line] w-5 h-5 text-gray-500 transform transition-transform duration-200" :class="{ 'rotate-180': show }"></span>
        </button>
        <div x-show="show" x-cloak x-transition class="mt-4 pt-4 border-t border-gray-200 dark:border-gray-800 text-sm text-gray-600 dark:text-gray-300 [&_ul]:my-1 [&_ul]:list-disc [&_ul]:pl-5 [&_li]:my-1 [&_ul_ul]:my-1 [&_a]:text-gray-600 dark:[&_a]:text-gray-400 [&_a:hover]:text-indigo-600 dark:[&_a:hover]:text-indigo-400 [&_a]:transition-colors">
            {{ .Page.TableOfContents }}
        </div>
    </div>

    <!-- 2. Versi Mobile: Tombol Floating di Pojok Kiri Bawah -->
    <div class="md:hidden">
        <!-- Tombol Melayang -->
        <button @click="mobileOpen = true" class="fixed bottom-20 left-6 z-40 flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-3 rounded-full shadow-lg transition-transform active:scale-95 focus:outline-none">
            <span class="icon-[ri--list-unordered] w-5 h-5"></span>
            <span class="text-sm font-medium">Daftar Isi</span>
        </button>

        <!-- Backdrop / Overlay Gelap -->
        <div x-show="mobileOpen" x-cloak x-transition.opacity class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm" @click="mobileOpen = false"></div>

        <!-- Sheet / Modal Pop-up dari Bawah untuk Mobile -->
        <div x-show="mobileOpen" x-cloak x-transition:enter="transition ease-out duration-300 transform" x-transition:enter-start="translate-y-full" x-transition:enter-end="translate-y-0" x-transition:leave="transition ease-in duration-200 transform" x-transition:leave-start="translate-y-0" x-transition:leave-end="translate-y-full" class="fixed inset-x-0 bottom-0 z-50 max-h-[80vh] overflow-y-auto bg-white dark:bg-gray-900 rounded-t-2xl border-t border-gray-200 dark:border-gray-800 p-6 shadow-2xl">
            <div class="flex items-center justify-between pb-4 mb-4 border-b border-gray-200 dark:border-gray-800">
                <h3 class="font-bold text-gray-900 dark:text-white flex items-center gap-2 text-base">
                    <span class="icon-[ri--menu-fold-line] w-5 h-5 text-indigo-600 dark:text-indigo-400"></span>
                    Daftar Isi Artikel
                </h3>
                <button @click="mobileOpen = false" class="p-2 text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 focus:outline-none">
                    <span class="icon-[ri--close-line] w-6 h-6"></span>
                </button>
            </div>
            <!-- Isi ToC (Otomatis menutup modal saat link diklik) -->
            <div @click="mobileOpen = false" class="text-sm text-gray-600 dark:text-gray-300 [&_ul]:my-1 [&_ul]:list-disc [&_ul]:pl-5 [&_li]:my-1 [&_ul_ul]:my-1 [&_a]:text-gray-600 dark:[&_a]:text-gray-400 [&_a:hover]:text-indigo-600 dark:[&_a:hover]:text-indigo-400 [&_a]:transition-colors">
                {{ .Page.TableOfContents }}
            </div>
        </div>
    </div>

</div>
{{ end }}
