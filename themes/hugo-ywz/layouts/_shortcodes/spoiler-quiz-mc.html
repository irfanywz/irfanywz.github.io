{{ $q := .Get "q" | default "Pilih jawaban yang benar:" }}
{{ $options := split (.Get "options" | default "A,B,C,D") "," }}
{{ $correct := .Get "correct" | default "0" }}
{{ $cooldownSec := .Get "cooldown" | default "5" }}
{{ $label := .Get "label" | default "Kuis Pilihan Ganda" }}

<div class="my-6 not-prose" 
     x-data="{ 
         unlocked: false, 
         selectedIndex: null, 
         correctIndex: {{ $correct }},
         errorMsg: '',
         cooldown: 0,
         cooldownMax: {{ $cooldownSec }},
         timer: null,
         
         checkChoice(index) {
             if (this.cooldown > 0) return;

             this.selectedIndex = index;
             if (parseInt(index) === parseInt(this.correctIndex)) {
                 this.unlocked = true;
                 this.errorMsg = '';
             } else {
                 this.startCooldown();
             }
         },

         startCooldown() {
             this.cooldown = this.cooldownMax;
             this.errorMsg = `Jawaban salah! Coba lagi dalam ${this.cooldown} detik.`;
             
             clearInterval(this.timer);
             this.timer = setInterval(() => {
                 this.cooldown--;
                 if (this.cooldown > 0) {
                     this.errorMsg = `Jawaban salah! Coba lagi dalam ${this.cooldown} detik.`;
                 } else {
                     clearInterval(this.timer);
                     this.errorMsg = '';
                 }
             }, 1000);
         }
     }">
    <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 overflow-hidden transition-all duration-200 shadow-sm">
        <!-- Header -->
        <div class="w-full flex items-center justify-between px-4 py-3 bg-zinc-100/80 dark:bg-zinc-800/80 text-sm font-semibold text-zinc-700 dark:text-zinc-300 select-none">
            <span class="flex items-center gap-2">
                <span class="icon-[ri--list-check] w-4 h-4 text-amber-500 dark:text-amber-400 shrink-0" x-show="!unlocked"></span>
                <span class="icon-[ri--lock-unlock-line] w-4 h-4 text-emerald-500 dark:text-emerald-400 shrink-0" x-show="unlocked"></span>
                <span x-text="unlocked ? 'Spoiler Terbuka' : '{{ $label }}'"></span>
            </span>
            <span class="text-[11px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded"
                  :class="unlocked ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-500/20' : 'bg-amber-100 text-amber-700 dark:bg-amber-500/10 dark:text-amber-400 border border-amber-200 dark:border-amber-500/20'"
                  x-text="unlocked ? 'Unlocked' : 'Quiz Locked'">
            </span>
        </div>

        <!-- Body -->
        <div class="p-4 sm:p-5 text-base text-zinc-700 dark:text-zinc-300 relative">
            <template x-if="!unlocked">
                <div class="space-y-4">
                    <div class="text-base font-normal text-zinc-800 dark:text-zinc-200 leading-relaxed">
                        <span class="text-amber-600 dark:text-amber-400 font-bold">Pertanyaan:</span> {{ $q }}
                    </div>

                    <!-- List Pilihan -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1">
                        {{ range $idx, $opt := $options }}
                        <button type="button" 
                                @click="checkChoice({{ $idx }})"
                                :disabled="cooldown > 0"
                                :class="cooldown > 0 ? 'opacity-50 cursor-not-allowed bg-zinc-100 dark:bg-zinc-950' : 'hover:bg-zinc-100 dark:hover:bg-zinc-800 hover:border-zinc-300 dark:hover:border-zinc-700 cursor-pointer bg-zinc-50 dark:bg-zinc-950/60'"
                                class="flex items-center justify-between px-4 py-2.5 text-sm rounded-lg border border-zinc-200 dark:border-zinc-800 text-zinc-800 dark:text-zinc-300 transition-all text-left group">
                            <span>{{ $opt }}</span>
                            <span class="w-2.5 h-2.5 rounded-full bg-zinc-300 dark:bg-zinc-700 group-hover:bg-sky-500 dark:group-hover:bg-sky-400 transition-colors shrink-0"></span>
                        </button>
                        {{ end }}
                    </div>

                    <p x-show="errorMsg" x-text="errorMsg" class="text-xs text-rose-600 dark:text-rose-400 font-medium animate-pulse"></p>
                </div>
            </template>

            <template x-if="unlocked">
                <div class="animate-fadeIn prose dark:prose-invert max-w-none">
                    {{ .Inner | markdownify }}
                </div>
            </template>
        </div>
    </div>
</div>
