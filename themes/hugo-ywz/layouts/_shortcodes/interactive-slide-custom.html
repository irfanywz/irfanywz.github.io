{{ $title := .Get "title" }}
{{ $tag := .Get "tag" }}

<div 
  x-data="{ slideIndex: 0 }"
  x-init="slideIndex = Array.from($el.parentNode.children).indexOf($el)"
  x-show="currentSlide === slideIndex"
  class="w-full h-full absolute inset-0 flex flex-col justify-center items-center p-12 text-center"
>
  {{ if $tag }}<span class="px-3 py-1 bg-cyan-500/20 text-cyan-300 rounded-full text-xs font-semibold mb-4">{{ $tag }}</span>{{ end }}
  {{ if $title }}<h2 class="text-3xl font-bold mb-4">{{ $title }}</h2>{{ end }}
  <div class="text-slate-200 max-w-2xl text-lg leading-relaxed space-y-4">
    {{ .Inner | markdownify }}
  </div>
</div>
