{{ $title := .Get "title" | default "Ujian Interaktif" }}
{{ $passingScore := .Get "passingScore" | default 70 }}
{{ $musicYoutubeId := .Get "musicYoutubeId" | default "" }}

<div 
  x-data="{
    started: false,
    finished: false,
    isFullscreen: false,
    currentQ: 0,
    totalQ: 0,
    timePerQ: 0,
    timer: null,
    timeLeft: 0,
    userAnswers: [],
    finalScore: 0,
    
    // Audio / YouTube State
    ytMusicId: '{{ $musicYoutubeId }}'.trim(),
    ytPlayer: null,
    isMuted: false,
    isPlayingMusic: false,
    isLoadingApi: false,

    initExam() {
      this.$nextTick(() => {
        let nodes = this.$refs.questionsContainer.children;
        this.totalQ = nodes.length;
        this.updateQuestionVisibility();
      });
      
      document.addEventListener('fullscreenchange', () => {
        this.isFullscreen = !!document.fullscreenElement;
      });

      // Beneran bersih! Tidak ada loadYouTubeApi() di sini lagi.
    },

    updateQuestionVisibility() {
      let nodes = this.$refs.questionsContainer.children;
      Array.from(nodes).forEach((node, idx) => {
        if (idx === this.currentQ) {
          node.style.display = 'block';
        } else {
          node.style.display = 'none';
        }
      });
    },

    // Lazy load YouTube API & Inisialisasi Player
    async ensureYTPlayerReady() {
      if (!this.ytMusicId) return;

      // Jika player sudah ada, langsung return
      if (this.ytPlayer && typeof this.ytPlayer.playVideo === 'function') return;

      // Jika API belum dimasukkan ke HTML DOM, inject sekarang secara dynamic
      if (!window.YT) {
        if (!this.isLoadingApi) {
          this.isLoadingApi = true;
          let tag = document.createElement('script');
          tag.src = 'https://www.youtube.com/iframe_api';
          let firstScriptTag = document.getElementsByTagName('script')[0];
          firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
          
          window.onYouTubeIframeAPIReady = () => {
            this.initYTPlayer();
          };
        }
      } else if (!this.ytPlayer) {
        this.initYTPlayer();
      }

      // Tunggu sampai ytPlayer beneran initialized
      await new Promise((resolve) => {
        let checkReady = setInterval(() => {
          if (this.ytPlayer && typeof this.ytPlayer.playVideo === 'function') {
            clearInterval(checkReady);
            resolve();
          }
        }, 100);
      });
    },

    initYTPlayer() {
      if (this.ytPlayer) return;
      this.ytPlayer = new YT.Player(this.$refs.ytPlayerContainer, {
        height: '0',
        width: '0',
        videoId: this.ytMusicId,
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'loop': 1,
          'playlist': this.ytMusicId
        },
        events: {
          'onReady': () => {
            this.ytPlayer.setVolume(20);
          }
        }
      });
    },

    async playBGM() {
      if (this.isMuted || !this.ytMusicId) return;
      
      await this.ensureYTPlayerReady();

      if (this.ytPlayer && typeof this.ytPlayer.playVideo === 'function') {
        this.ytPlayer.playVideo();
        this.isPlayingMusic = true;
      }
    },

    stopMusic() {
      if (this.ytPlayer && typeof this.ytPlayer.stopVideo === 'function') {
        this.ytPlayer.stopVideo();
        this.isPlayingMusic = false;
      }
    },

    async toggleAudio() {
      this.isMuted = !this.isMuted;

      if (!this.isMuted) {
        await this.ensureYTPlayerReady();
        if (this.ytPlayer && typeof this.ytPlayer.unMute === 'function') {
          this.ytPlayer.unMute();
          this.playBGM();
        }
      } else {
        if (this.ytPlayer && typeof this.ytPlayer.mute === 'function') {
          this.ytPlayer.mute();
        }
      }
    },

    startExam() {
      this.started = true;
      this.currentQ = 0;
      this.userAnswers = Array(this.totalQ).fill(null);
      this.updateQuestionVisibility();
      this.startTimerForCurrentQ();
      
      // YouTube API baru terdistribusi dan di-play di sini!
      this.playBGM();
    },

    startTimerForCurrentQ() {
      this.stopTimer();
      let currentEl = this.$refs.questionsContainer.children[this.currentQ];
      if (!currentEl) return;
      this.timePerQ = parseInt(currentEl.getAttribute('data-time') || '20');
      this.timeLeft = this.timePerQ;

      this.timer = setInterval(() => {
        if (this.timeLeft > 0) {
          this.timeLeft--;
        } else {
          this.nextQuestion();
        }
      }, 1000);
    },

    stopTimer() {
      if (this.timer) clearInterval(this.timer);
    },

    selectOption(val) {
      this.userAnswers[this.currentQ] = val;
    },

    toggleCheckboxOption(optIdx) {
      let currentArr = this.userAnswers[this.currentQ];
      if (!Array.isArray(currentArr)) {
        currentArr = [];
      } else {
        currentArr = [...currentArr];
      }
      
      let foundIdx = currentArr.indexOf(optIdx);
      if (foundIdx > -1) {
        currentArr.splice(foundIdx, 1);
      } else {
        currentArr.push(optIdx);
      }
      this.userAnswers[this.currentQ] = currentArr;
    },

    nextQuestion() {
      this.stopTimer();
      if (this.currentQ < this.totalQ - 1) {
        this.currentQ++;
        this.updateQuestionVisibility();
        this.startTimerForCurrentQ();
      } else {
        this.finishExam();
      }
    },

    finishExam() {
      this.stopTimer();
      this.stopMusic();
      this.finished = true;
      this.calculateScore();
    },

    calculateScore() {
      let correctCount = 0;
      let nodes = this.$refs.questionsContainer.children;

      Array.from(nodes).forEach((node, idx) => {
        if (this.isAnswerCorrect(node, idx)) {
          correctCount++;
        }
      });

      this.finalScore = Math.round((correctCount / this.totalQ) * 100);
    },

    toggleFullscreen() {
      let el = this.$refs.mainExamContainer;
      if (!document.fullscreenElement) {
        el.requestFullscreen().then(() => {
          this.isFullscreen = true;
        }).catch(() => {});
      } else {
        document.exitFullscreen().then(() => {
          this.isFullscreen = false;
        }).catch(() => {});
      }
    },

    isAnswerCorrect(node, idx) {
      let type = node.getAttribute('data-type');
      let userAns = this.userAnswers[idx];

      if (type === 'fill' || type === 'fill-in-the-blank') {
        let key = node.getAttribute('data-answer-key') || '';
        return userAns && userAns.toString().trim().toLowerCase() === key.trim().toLowerCase();
      } else if (type === 'tf' || type === 'true-false') {
        let tfKey = node.getAttribute('data-tf-answer') || 'true';
        return userAns && userAns.toString().toLowerCase() === tfKey.toLowerCase();
      } else if (type === 'checkbox' || type === 'multiple-answer') {
        let correctStr = node.getAttribute('data-correct-key') || '';
        let targetArr = correctStr.split(',').map(n => parseInt(n.trim())).sort((a,b) => a - b);
        if (!Array.isArray(userAns)) return false;
        let sortedUserAns = [...userAns].sort((a,b) => a - b);
        return JSON.stringify(targetArr) === JSON.stringify(sortedUserAns);
      } else {
        return userAns === parseInt(node.getAttribute('data-correct'));
      }
    },

    getFormattedUserAns(node, idx) {
      let type = node.getAttribute('data-type');
      let userAns = this.userAnswers[idx];

      if (userAns === null || userAns === undefined || userAns === '' || (Array.isArray(userAns) && userAns.length === 0)) {
        return 'Tidak Dijawab / Kosong';
      }

      if (type === 'fill' || type === 'fill-in-the-blank') return userAns;
      if (type === 'tf' || type === 'true-false') return userAns === 'true' ? 'BENAR' : 'SALAH';

      let opts = (node.getAttribute('data-options') || '').split(',');
      if (type === 'checkbox' || type === 'multiple-answer') {
        return userAns.map(i => opts[i] || i).join(', ');
      }
      
      return opts[userAns] || userAns;
    },

    getFormattedCorrectKey(node) {
      let type = node.getAttribute('data-type');

      if (type === 'fill' || type === 'fill-in-the-blank') return node.getAttribute('data-answer-key');
      if (type === 'tf' || type === 'true-false') return node.getAttribute('data-tf-answer') === 'true' ? 'BENAR' : 'SALAH';

      let opts = (node.getAttribute('data-options') || '').split(',');
      if (type === 'checkbox' || type === 'multiple-answer') {
        let keys = (node.getAttribute('data-correct-key') || '').split(',').map(n => parseInt(n.trim()));
        return keys.map(i => opts[i] || i).join(', ');
      }

      let correctIdx = parseInt(node.getAttribute('data-correct'));
      return opts[correctIdx] || '-';
    }
  }"
  x-ref="mainExamContainer"
  x-init="initExam()"
  :class="isFullscreen ? 'h-screen w-screen rounded-none border-none my-0' : 'h-[650px] max-h-[85vh] w-full rounded-3xl border my-8 shadow-2xl'"
  class="relative bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 border-slate-200 dark:border-slate-800/80 font-sans flex flex-col overflow-hidden select-none transition-all duration-300"
>
  <!-- Hidden YouTube Player Container -->
  <div class="hidden" x-ref="ytPlayerContainer"></div>

  <!-- Background Texture Grid -->
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-100 via-slate-50 to-slate-50 dark:from-slate-900 dark:via-slate-950 dark:to-slate-950 pointer-events-none"></div>

  <!-- UNIVERSAL HEADER BAR -->
  <div class="relative z-20 flex items-center justify-between w-full px-4 sm:px-6 py-3 border-b border-slate-200 dark:border-slate-800/80 bg-white/40 dark:bg-slate-900/40 backdrop-blur-md shrink-0 not-prose">
    
    <!-- Kiri: Icon, Label Tag, & Title -->
    <div class="flex items-center gap-3 min-w-0 pr-2">
      <div class="p-2 bg-cyan-500/10 border border-cyan-500/20 rounded-xl text-cyan-600 dark:text-cyan-400 shrink-0 flex items-center justify-center">
        <span class="icon-[lucide--file-text] text-lg sm:text-xl leading-none"></span>
      </div>

      <div class="flex flex-col justify-center min-w-0 leading-none">
        <span class="text-[10px] font-bold uppercase tracking-wider text-cyan-600 dark:text-cyan-400 mb-1 block">
          UJIAN EVALUASI
        </span>
        <h2 class="!m-0 !p-0 text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-100 truncate leading-tight max-w-[140px] xs:max-w-[200px] sm:max-w-md">
          {{ $title }}
        </h2>
      </div>
    </div>

    <!-- Kanan: Audio Controls, Timer, Counter & Fullscreen -->
    <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
      
      <!-- Tombol Audio Mute/Unmute -->
      <template x-if="ytMusicId">
        <button 
          type="button"
          @click="toggleAudio()"
          class="p-2 bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700/50 rounded-xl text-slate-600 dark:text-slate-300 transition flex items-center justify-center cursor-pointer"
          :title="isMuted ? 'Unmute Audio' : 'Mute Audio'"
        >
          <span class="text-sm" :class="isMuted ? 'icon-[lucide--volume-x] text-rose-500' : 'icon-[lucide--volume-2] text-cyan-500'"></span>
        </button>
      </template>

      <!-- Timer -->
      <template x-if="started && !finished">
        <div class="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 px-2.5 py-1.5 rounded-xl text-slate-700 dark:text-slate-200 text-xs font-semibold">
          <span class="icon-[lucide--timer] text-cyan-500 animate-pulse text-sm"></span>
          <span>0:<span x-text="timeLeft < 10 ? '0' + timeLeft : timeLeft"></span></span>
        </div>
      </template>

      <!-- Indicator Nomor Soal -->
      <template x-if="started && !finished">
        <div class="hidden sm:flex items-center bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 px-2.5 py-1.5 rounded-xl text-xs font-medium text-slate-500 dark:text-slate-400">
          Soal&nbsp;<strong class="text-cyan-600 dark:text-cyan-400" x-text="currentQ + 1"></strong>/<span x-text="totalQ"></span>
        </div>
      </template>

      <!-- Tombol Fullscreen Bar -->
      <button 
        type="button"
        @click="toggleFullscreen()" 
        class="p-2 sm:px-2.5 sm:py-1.5 bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700/50 rounded-xl text-slate-600 dark:text-slate-300 transition flex items-center gap-1.5 text-xs font-semibold cursor-pointer"
        title="Toggle Fullscreen"
      >
        <span class="text-sm" :class="isFullscreen ? 'icon-[lucide--minimize]' : 'icon-[lucide--maximize]'"></span>
        <span class="hidden sm:inline" x-text="isFullscreen ? 'Exit Fullscreen' : 'Layar Penuh'"></span>
      </button>
    </div>

  </div>

  <!-- 1. START SCREEN -->
  <template x-if="!started && !finished">
    <div class="relative z-10 flex flex-col items-center justify-center flex-1 p-6 text-center max-w-xl mx-auto my-auto">
      <div class="p-4 bg-cyan-500/10 border border-cyan-500/20 rounded-3xl mb-4 text-cyan-500">
        <span class="icon-[lucide--award] text-5xl sm:text-6xl"></span>
      </div>
      <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white mb-2">{{ $title }}</h1>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mb-6 leading-relaxed">
        Ujian ini terdiri dari <strong x-text="totalQ"></strong> soal. Setiap soal memiliki batas waktu masing-masing. Silakan klik tombol di bawah untuk memulai.
      </p>
      
      <button 
        type="button"
        @click="startExam()"
        class="px-8 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-2xl shadow-lg transition transform hover:-translate-y-0.5 cursor-pointer flex items-center gap-2 text-sm sm:text-base"
      >
        <span class="icon-[lucide--play]"></span> MULAI UJIAN
      </button>
    </div>
  </template>

  <!-- 2. EXAM SCREEN -->
  <div x-show="started && !finished" class="relative z-10 w-full flex-1 flex flex-col justify-between p-4 sm:p-6 md:p-8 overflow-y-auto">
    <!-- Questions Container -->
    <div x-ref="questionsContainer" class="my-auto py-2">
      {{ .Inner }}
    </div>

    <!-- Footer Action -->
    <div class="flex items-center justify-between w-full pt-4 border-t border-slate-200 dark:border-slate-800/80 shrink-0">
      <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 sm:hidden">
        <strong class="text-cyan-600 dark:text-cyan-400" x-text="currentQ + 1"></strong> / <span x-text="totalQ"></span>
      </span>

      <button 
        type="button"
        @click="nextQuestion()"
        :disabled="userAnswers[currentQ] === null || userAnswers[currentQ] === '' || (Array.isArray(userAnswers[currentQ]) && userAnswers[currentQ].length === 0)"
        class="ml-auto px-6 py-2.5 bg-cyan-600 hover:bg-cyan-500 disabled:opacity-40 text-white font-semibold rounded-xl text-xs sm:text-sm transition flex items-center gap-2 cursor-pointer shadow-md"
      >
        <span x-text="currentQ === totalQ - 1 ? 'Selesai & Kirim' : 'Soal Selanjutnya'"></span>
        <span class="icon-[lucide--arrow-right]"></span>
      </button>
    </div>
  </div>

  <!-- 3. RESULT & REVIEW SCREEN -->
  <template x-if="finished">
    <div class="relative z-10 w-full flex-1 overflow-y-auto p-6 sm:p-8 scrollbar-thin">
      <div class="max-w-3xl mx-auto">
        <!-- Score Banner -->
        <div class="flex flex-col items-center text-center mb-8 pb-6 border-b border-slate-200 dark:border-slate-800">
          <span class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Hasil Akhir Ujian</span>
          <div class="text-5xl sm:text-6xl font-black mb-2" :class="finalScore >= {{ $passingScore }} ? 'text-emerald-500' : 'text-rose-500'" x-text="finalScore"></div>
          <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
            <span x-text="finalScore >= {{ $passingScore }} ? 'Selamat! Anda dinyatakan LULUS.' : 'Maaf, Anda belum mencapai nilai kelulusan.'"></span>
          </p>
        </div>

        <!-- Evaluation / Pembahasan -->
        <h3 class="text-base font-bold text-slate-900 dark:text-white mb-4 flex items-center gap-2">
          <span class="icon-[lucide--file-search] text-cyan-500"></span> Evaluasi & Pembahasan
        </h3>

        <div class="space-y-4">
          <template x-for="(node, idx) in Array.from($refs.questionsContainer.children)" :key="idx">
            <div 
              class="p-4 sm:p-5 rounded-2xl border bg-white/50 dark:bg-slate-900/50"
              :class="isAnswerCorrect(node, idx) ? 'border-emerald-500/40' : 'border-rose-500/40'"
            >
              <div class="flex items-start gap-3 mb-3">
                <span 
                  class="px-2.5 py-1 rounded-lg text-xs font-bold shrink-0"
                  :class="isAnswerCorrect(node, idx) ? 'bg-emerald-500/10 text-emerald-500' : 'bg-rose-500/10 text-rose-500'"
                  x-text="'No. ' + (idx + 1)"
                ></span>
                <h4 class="text-xs sm:text-sm font-semibold text-slate-800 dark:text-slate-200 leading-relaxed" x-text="node.getAttribute('data-title')"></h4>
              </div>

              <!-- Detail Jawaban User vs Kunci -->
              <div class="text-xs space-y-1.5 pl-1 sm:pl-3 border-l-2 border-slate-200 dark:border-slate-800 my-3">
                <div class="flex items-start gap-2">
                  <span class="text-slate-400 shrink-0">Jawaban Kamu:</span>
                  <span class="font-bold" 
                    :class="isAnswerCorrect(node, idx) ? 'text-emerald-500' : 'text-rose-500'"
                    x-text="getFormattedUserAns(node, idx)"
                  ></span>
                </div>
                
                <template x-if="!isAnswerCorrect(node, idx)">
                  <div class="flex items-start gap-2">
                    <span class="text-slate-400 shrink-0">Kunci Jawaban:</span>
                    <span class="font-bold text-emerald-500" x-text="getFormattedCorrectKey(node)"></span>
                  </div>
                </template>
              </div>

              <!-- Pembahasan / Explanation -->
              <template x-if="node.getAttribute('data-explanation')">
                <div class="mt-3 p-3 rounded-xl bg-slate-100 dark:bg-slate-800/60 text-[11px] sm:text-xs text-slate-600 dark:text-slate-300">
                  <strong class="text-cyan-600 dark:text-cyan-400 block mb-1">Pembahasan:</strong>
                  <span x-text="node.getAttribute('data-explanation')"></span>
                </div>
              </template>
            </div>
          </template>
        </div>

        <!-- Restart Button -->
        <div class="mt-8 text-center pb-4">
          <button type="button" @click="finished = false; started = false; updateQuestionVisibility();" class="px-6 py-2.5 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 text-xs sm:text-sm font-semibold rounded-xl transition cursor-pointer">
            Ulangi Ujian
          </button>
        </div>
      </div>
    </div>
  </template>
</div>
