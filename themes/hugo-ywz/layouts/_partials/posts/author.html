<!-- Author Widget -->
<div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 text-center">
    <div class="relative inline-block mb-4">
        <div class="w-24 h-24 rounded-full border-4 border-white dark:border-gray-700 shadow-lg overflow-hidden group">
            <img 
                src="/{{ .Site.Params.Avatar | safeURL }}" 
                alt="{{ .Site.Title }}" 
                class="w-full h-full object-cover"
            >
        </div>
        <span class="absolute bottom-1 right-1 w-4 h-4 bg-green-500 border-2 border-white dark:border-gray-700 rounded-full animate-pulse"></span>
    </div>
    <!-- <h3 class="text-xl font-bold text-gray-900 dark:text-white">{{ .Site.Title }}</h3> -->
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">{{ .Site.Params.description }}</p>
    <a href="{{ "/about/" | relURL }}" class="inline-flex items-center justify-center px-4 py-2 mb-4 bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 rounded-lg text-sm font-medium transition-colors">
        Selengkapnya
        <span class="icon-[ri--arrow-right-line] ml-1"></span>
    </a>
</div>
