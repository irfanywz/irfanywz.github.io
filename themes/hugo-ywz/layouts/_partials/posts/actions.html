<div x-data="{ open: false, loaded: false }" class="w-full">
  <!-- 1 Kotak Utama (Menyatukan Reaction, Komentar, dan View) -->
  <div class="post-reactions flex flex-wrap items-center justify-between gap-4 p-3 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700" data-id='{{ .RelPermalink }}'>
    
    <!-- Bagian Kiri: Reaction Items (Clap, Fire, Lightbulb) -->
    <div class="flex items-center gap-2 sm:gap-4">
      <!-- Clap -->
      <div class="reaction-item relative flex flex-col items-center py-1 px-3 cursor-pointer rounded-xl transition-colors hover:bg-gray-50 dark:hover:bg-gray-700" data-type="clap">
        <span class="icon-[ri--thumb-up-line] w-6 h-6 text-indigo-500 mb-1"></span>
        <span class="count reaction-loading text-xs font-semibold text-gray-900 dark:text-white">0</span> 
      </div>

      <!-- Wow / Fire -->
      <div class="reaction-item relative flex flex-col items-center py-1 px-3 cursor-pointer rounded-xl transition-colors hover:bg-gray-50 dark:hover:bg-gray-700" data-type="wow">
        <span class="icon-[ri--fire-line] w-6 h-6 text-orange-500 mb-1"></span>
        <span class="count reaction-loading text-xs font-semibold text-gray-900 dark:text-white">0</span>
      </div>

      <!-- Hmm / Lightbulb -->
      <div class="reaction-item relative flex flex-col items-center py-1 px-3 cursor-pointer rounded-xl transition-colors hover:bg-gray-50 dark:hover:bg-gray-700" data-type="hmm">
        <span class="icon-[ri--lightbulb-line] w-6 h-6 text-yellow-500 mb-1"></span>
        <span class="count reaction-loading text-xs font-semibold text-gray-900 dark:text-white">0</span>
      </div>
    </div>

    <!-- Pemisah Garis Tipis -->
    <div class="hidden sm:block h-8 w-[1px] bg-gray-200 dark:bg-gray-700"></div>

    <!-- Bagian Kanan: Tombol Komentar & View Count -->
    <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
      
      <!-- Tombol Komentar + Disqus Comment Count -->
      <button 
        @click="open = true" 
        class="flex items-center gap-2 py-2 px-4 bg-gray-100 hover:bg-blue-50 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 hover:text-blue-600 dark:hover:text-blue-400 rounded-xl text-sm font-semibold transition-all duration-200 cursor-pointer"
      >
        <span class="icon-[ri--chat-3-line] w-5 h-5"></span>
        <span>Komentar</span>
        <!-- Badge Jumlah Komentar Disqus -->
        <span class="disqus-comment-count bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white text-xs px-2 py-0.5 rounded-md ml-1" data-disqus-identifier="{{ .File.UniqueID }}">0</span>
      </button>

      <!-- View Count -->
      <div class="flex items-center gap-2 py-2 px-3 bg-gray-50 dark:bg-gray-900 rounded-xl border border-gray-100 dark:border-gray-800 text-gray-600 dark:text-gray-400 text-xs font-medium">
        <span class="icon-[ri--eye-line] w-5 h-5 text-gray-400"></span>
        <span class="post-view font-bold text-gray-900 dark:text-white" data-id='{{ .RelPermalink }}'>    
          <span class='view-load post-views-count-placeholder'>0</span>
        </span>
      </div>

    </div>
  </div>

  <!-- Panel Offcanvas Komentar (Bawah) -->
  <div 
    x-show="open" 
    class="fixed inset-0 z-50 overflow-hidden"
    style="display: none;"
  >
    <!-- Backdrop -->
    <div 
      x-show="open" 
      x-transition:enter="transition-opacity ease-out duration-300"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="transition-opacity ease-in duration-200"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      @click="open = false"
      class="absolute inset-0 bg-black/50 backdrop-blur-xs"
    ></div>

    <!-- Konten Offcanvas -->
    <div 
      x-show="open"
      x-transition:enter="transition-transform ease-out duration-300"
      x-transition:enter-start="translate-y-full"
      x-transition:enter-end="translate-y-0"
      x-transition:leave="transition-transform ease-in duration-300"
      x-transition:leave-start="translate-y-0"
      x-transition:leave-end="translate-y-full"
      class="absolute bottom-0 left-0 right-0 md:w-3/4 md:mx-auto lg:w-2/3 h-[85vh] bg-white dark:bg-gray-900 rounded-t-3xl shadow-2xl flex flex-col"
    >
      <!-- Header Offcanvas -->
      <div class="flex items-center justify-between p-5 border-b border-gray-200 dark:border-gray-800 rounded-t-3xl bg-white dark:bg-gray-900 z-10">
        <h3 class="text-lg font-bold text-gray-900 dark:text-white flex items-center gap-2">
          <span class="icon-[ri--chat-3-line] w-5 h-5 text-blue-500"></span>
          Diskusi Komentar
        </h3>
        <button @click="open = false" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition cursor-pointer">
          <span class="icon-[ri--close-line] w-6 h-6"></span>
        </button>
      </div>

      <!-- Body / Tempat Disqus -->
      <div 
        class="flex-1 overflow-y-auto p-6 bg-gray-50 dark:bg-gray-950 text-left"
        x-init="$watch('open', value => {
          if (value && !loaded) {
            loaded = true;
            window.disqus_config = function () {
              this.page.url = '{{ .Permalink }}';
              this.page.identifier = '{{ .File.UniqueID }}';
              this.page.title = '{{ .Title }}';
            };
            var d = document, s = d.createElement('script');
            s.src = 'https://muhamad-irfan.disqus.com/embed.js';
            s.setAttribute('data-timestamp', +new Date());
            (d.head || d.body).appendChild(s);
          }
        })"
      >
        <div id="disqus_wrapper">
          <div id="disqus_thread">
            <!-- Loading Spinner -->
            <div x-show="!loaded" class="flex justify-center items-center h-40">
              <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            </div>
          </div>
        </div>
        <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
      </div>
      
    </div>
  </div>
</div>
