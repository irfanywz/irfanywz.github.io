<!-- Nosidebar Ads Widget -->
{{ if .Site.Params.showAdsSidebar }}
    {{ with .Site.Params.adCodeSidebar }}
    <div class="bg-white dark:bg-gray-800 p-6 text-center text-sm text-gray-400 border border-gray-200/80 dark:border-gray-700/80 shadow-xs my-8 flex items-center justify-center min-h-[140px]">
        <div class="w-full">
            <span class="text-[10px] uppercase tracking-widest text-gray-400/70 block mb-2">Iklan / Sponsored</span>
            {{ . | safeHTML }}
        </div>
    </div>
    {{ end }}
{{ end }}
