<header 
    x-data="{ 
        visible: true, 
        lastScrollTop: 0,
        translateOpen: false,
        translateLoaded: false,
        translateReady: false,
        initTranslate() {
            // Daftarkan fungsi callback global untuk Google Translate sekali saja
            if (!window.googleTranslateElementInit) {
                window.googleTranslateElementInit = () => {
                    new google.translate.TranslateElement({
                        pageLanguage: 'id',
                        includedLanguages: 'en',
                        autoDisplay: false,
                        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
                    }, 'google_translate_element');

                    // Cek berkala apakah Google Translate sudah sukses me-render isi elemennya
                    let checkInterval = setInterval(() => {
                        if (document.querySelector('.skiptranslate.goog-te-gadget')) {
                            this.translateReady = true;
                            clearInterval(checkInterval);
                        }
                    }, 200);
                };
            }

            // Load script Google Translate jika belum pernah di-load
            if (!this.translateLoaded) {
                this.translateLoaded = true;
                const script = document.createElement('script');
                script.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
                script.async = true;
                document.body.appendChild(script);
            }
        },
        scroll() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > this.lastScrollTop && scrollTop > 50) {
                this.visible = false;
            } else {
                this.visible = true;
            }
            this.lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        }
    }"
    @scroll.window="scroll()"
    :class="visible ? 'translate-y-0' : '-translate-y-full'"
    class="sticky top-0 left-0 right-0 z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 transition-all duration-300">
    <div class="container max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
        <!-- Mobile Menu Button -->
        <button @click="$store.nav.toggle()" type="button" class="flex p-2 text-2xl text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-colors me-1" aria-label="Toggle Menu">
            <i class="icon-[ri--menu-4-line]"></i>
        </button>

        <!-- Brand -->
        <div class="flex-shrink-0">
            <a href="{{ .Site.BaseURL }}" class="flex items-center">
                <img src='{{ "logo.avif" | relURL }}' alt="{{ .Site.Title }} logo" class="h-8 w-auto mr-2">
            </a>
        </div>

        <div class="flex-grow hidden md:flex"></div>

        <!-- Desktop Nav -->
        <nav class="hidden md:flex items-center gap-8">
            {{ range .Site.Menus.main }}
                {{ $menu_item_url := .URL | relLangURL }}
                {{ $page_url := $.Page.RelPermalink | relLangURL }}
                {{ $page_split := index (split $page_url "/") 1 }}
                {{ $active := and (strings.Contains $menu_item_url $page_split) (not $.IsHome) }}
                
                <a href="{{ .URL | relLangURL }}" class='flex items-center gap-2 text-sm font-medium transition-colors {{ if or ($active) (and ($.IsHome) (eq .URL "/")) }}text-indigo-600 dark:text-indigo-400{{ else }}text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400{{ end }}'>
                    <i class="{{ .Pre }}"></i>
                    <span>{{ .Name }}</span>
                </a>
            {{ end}}
        </nav>

        <div class="flex-grow hidden md:flex md:mr-10"></div>

        <div class="flex items-center ml-1">

            <!-- Translate Dropdown (Lazy Loaded & Clean) -->
            <div class="relative">
                <button @click="translateOpen = !translateOpen; initTranslate()" class="p-2 text-xl text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center" aria-label="Translate">
                    <i class="icon-[ri--translate-2]"></i>
                </button>

                <!-- Dropdown Box -->
                <div x-show="translateOpen" 
                     @click.away="translateOpen = false" 
                     x-transition 
                     class="absolute right-0 mt-2 p-3 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-lg z-50 min-w-[180px]"
                     style="display: none;">
                    <div class="text-xs font-semibold text-gray-400 dark:text-gray-500 mb-2 uppercase tracking-wider">Language</div>
                    
                    <!-- Loading Spinner (Akan muncul sebelum Google Translate siap) -->
                    <div x-show="!translateReady" class="flex justify-center items-center py-4">
                        <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-indigo-600"></div>
                    </div>

                    <div id="google_translate_element"></div>
                </div>
            </div>

            <!-- Search -->
            <a href="/search" class='p-2 text-xl transition-colors {{ if eq .Page.RelPermalink "/search/" }}text-indigo-600 dark:text-indigo-400{{ else }}text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400{{ end }}' aria-label="Search">
                <i class="icon-[ri--search-line]"></i>
            </a>
        </div>
    </div>
</header>
