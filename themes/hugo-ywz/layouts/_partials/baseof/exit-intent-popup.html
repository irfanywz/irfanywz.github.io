<!-- Exit Intent Popup -->
<div 
    x-data
    x-init="$store.exitIntent.init()"
    x-show="$store.exitIntent.isVisible"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @keydown.escape.window="$store.exitIntent.close()"
    class="fixed inset-0 z-[90] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4"
    style="display: none;">

    <!-- Popup Box -->
    <div 
        @click.outside="$store.exitIntent.close()"
        x-show="$store.exitIntent.isVisible"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 scale-95"
        x-transition:enter-end="opacity-100 scale-100"
        class="relative bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md p-8 text-center border border-gray-200 dark:border-gray-700">
        
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-3">Tunggu, Jangan Pergi Dulu!</h2>
        <p class="text-gray-600 dark:text-gray-300 mb-6">Dapatkan update artikel dan proyek terbaru dari saya langsung di kotak masuk Anda. Tidak ada spam, hanya konten berkualitas.</p>
        
        <a href="https://www.getrevue.co/profile/irfanykywz/add_subscriber" target="_blank" class="w-full block px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition-colors">
            Berlangganan Newsletter
        </a>
        <button @click="$store.exitIntent.close()" class="mt-4 text-sm text-gray-500 dark:text-gray-400 hover:underline">Lain kali saja</button>
    </div>
</div>
