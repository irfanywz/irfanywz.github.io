<div x-data="{ 
        scrolled: false,
        scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }" 
    @scroll.window="scrolled = (window.pageYOffset > 300)"
    class="fixed bottom-20 right-4 z-30 md:bottom-8 md:right-8">
    
    <button @click="scrollToTop()"
            x-show="scrolled"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-4"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-4"
            class="w-11 h-11 bg-white/90 dark:bg-gray-800/90 backdrop-blur-md text-gray-700 dark:text-gray-200 hover:text-indigo-600 dark:hover:text-indigo-400 rounded-2xl shadow-lg border border-gray-200/80 dark:border-gray-700/80 flex items-center justify-center hover:bg-white dark:hover:bg-gray-800 transition-all duration-300 focus:outline-none group cursor-pointer"
            aria-label="Kembali ke atas"
            style="display: none;">
        <span class="icon-[ri--arrow-up-line] w-5 h-5 transition-transform duration-300 group-hover:-translate-y-0.5"></span>
    </button>
</div>
