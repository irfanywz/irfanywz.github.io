<nav 
    x-data="{ 
        visible: true, 
        lastScrollTop: 0,
        scroll() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > this.lastScrollTop && scrollTop > 100) {
                this.visible = false;
            } else {
                this.visible = true;
            }
            this.lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        }
    }"
    @scroll.window="scroll()"
    :class="visible ? 'translate-y-0' : 'translate-y-full'"
    class="fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 flex justify-around items-stretch h-[68px] z-[20] md:hidden transition-transform duration-300 transform-gpu shadow-[0_-2px_10px_rgba(0,0,0,0.05)]"
    style="padding: 10px 0; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);">
    
    {{ range .Site.Menus.bottom }}
        {{ $menu_item_url := .URL | relLangURL }}
        {{ $page_url := $.Page.RelPermalink | relLangURL }}
        {{ $page_split := index (split $page_url "/") 1 }}
        {{ $active := and (strings.Contains $menu_item_url $page_split) (not $.IsHome) }}
        
        <a href="{{ .URL | relLangURL }}" 
           class="flex flex-1 flex-col items-center justify-center gap-0.5 text-[10px] font-medium transition-colors {{ if or ($active) (and ($.IsHome) (eq .URL "/")) }}text-indigo-600 dark:text-indigo-400{{ else }}text-gray-500 dark:text-gray-400{{ end }}">
            <div class="flex items-center justify-center h-6 w-6 overflow-hidden">
                <i class="{{ .Pre }} text-xl inline-block leading-none"></i>
            </div>
            <span class="leading-none">{{ .Name }}</span>
        </a>
    {{ end }}

</nav>
