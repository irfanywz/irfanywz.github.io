{{ with . }}
    {{ if .HasNext }}
    <div class="text-center mt-12"
        x-data="{
            pageUrls: [
                {{ range .Pagers }}
                    {{ if gt .PageNumber 1 }} '{{ .URL }}', {{ end }}
                {{ end }}
            ],
            currentIndex: 0,
            hasNext: true,
            loading: false,
            
            async loadMore() {
                if (this.loading || this.currentIndex >= this.pageUrls.length) return;
                this.loading = true;

                try {
                    const response = await fetch(this.pageUrls[this.currentIndex]);
                    const html = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    
                    const container = document.getElementById('content-container');
                    if (container) {
                        const newContent = doc.querySelectorAll('#content-container > *');
                        newContent.forEach(item => container.appendChild(item));
                    }

                    this.currentIndex++;
                    if (this.currentIndex >= this.pageUrls.length) this.hasNext = false;
                    history.pushState(null, '', this.pageUrls[this.currentIndex - 1]);
                } catch (error) {
                    console.error('Error:', error);
                } finally {
                    this.loading = false;
                }
            },
            
            // Inisialisasi Intersection Observer
            initObserver() {
                const observer = new IntersectionObserver((entries) => {
                    if (entries[0].isIntersecting && this.hasNext && !this.loading) {
                        this.loadMore();
                    }
                }, { threshold: 0.1 });
                
                observer.observe(this.$refs.sentinel);
            }
        }"
        x-init="initObserver()"
        x-show="hasNext"
        x-cloak>
        
        <!-- Elemen Sentinel (Penanda batas bawah) -->
        <div x-ref="sentinel" class="h-10"></div>

        <!-- Tombol (Tetap ada sebagai backup kalau user mau klik manual atau saat loading) -->
        <button @click="loadMore()" 
            :class="{ 'opacity-75 cursor-wait': loading }"
            class="inline-flex items-center gap-3 px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium shadow-sm">
            
            <span x-show="!loading">Memuat...</span>
            <div x-show="loading" class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        </button>
    </div>
    {{ end }}
{{ end }}
