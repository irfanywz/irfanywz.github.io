{{ with . }}
    {{ if .HasNext }}
    <div class="text-center mt-12"
        x-data="{
            // Kumpulkan semua URL halaman berikutnya menggunakan Pagers bawaan Hugo
            pageUrls: [
                {{ range .Pagers }}
                    {{ if gt .PageNumber 1 }}
                        '{{ .URL }}',
                    {{ end }}
                {{ end }}
            ],
            // Set index awal berdasarkan halaman aktif Hugo saat ini
            currentIndex: {{ sub .PageNumber 1 }},
            hasNext: true,
            loading: false,
            
            init() {
                // Jika sudah di halaman terakhir atau lebih, sembunyikan tombol
                if (this.currentIndex >= this.pageUrls.length) {
                    this.hasNext = false;
                }
            },

            async loadMore() {
                if (this.loading || this.currentIndex >= this.pageUrls.length) return;
                this.loading = true;

                const targetUrl = this.pageUrls[this.currentIndex];

                try {
                    const response = await fetch(targetUrl);
                    const html = await response.text();
                    
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    
                    // Masukkan post baru ke kontainer utama
                    const container = document.getElementById('content-container');
                    if (container) {
                        const newContent = doc.querySelectorAll('#content-container > *');
                        newContent.forEach(item => {
                            container.appendChild(item);
                        });
                    }

                    // Geser index ke halaman berikutnya
                    this.currentIndex++;

                    // Jika sudah mencapai halaman terakhir, sembunyikan tombol
                    if (this.currentIndex >= this.pageUrls.length) {
                        this.hasNext = false;
                    }

                    // Update URL browser history tanpa reload
                    history.pushState(null, '', targetUrl);

                } catch (error) {
                    console.error('Error loading more content:', error);
                } finally {
                    this.loading = false;
                }
            }
        }"
        x-show="hasNext"
        x-cloak>
        
        <button @click="loadMore()" 
            :class="{ 'pointer-events-none opacity-75': loading }"
            class="inline-flex items-center gap-3 px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium shadow-sm focus:outline-none">
            
            <span x-show="!loading">Muat Lebih Banyak</span>
            <div x-show="loading" class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin" x-cloak></div>
        </button>
    </div>
    {{ end }}
{{ end }}
