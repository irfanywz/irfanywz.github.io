<div x-data="quotePlayerApp()">
    <!-- Tombol Pemicu Modal Quote Utama -->
    <button @click="quoteModalOpen = true" class="w-10 h-10 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white flex items-center justify-center transition-all shadow-sm cursor-pointer group" title="Lihat Semua Kutipan">
        <span class="icon-[ri--book-open-line] w-5 h-5 group-hover:scale-110 transition-transform"></span>
    </button>

    <!-- OFFCANVAS PANEL UTAMA -->
    <div x-show="quoteModalOpen" class="fixed inset-0 z-50 overflow-hidden" style="display: none;">
        <!-- Backdrop Utama -->
        <div x-show="quoteModalOpen"
             x-transition:enter="transition-opacity ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition-opacity ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             @click="quoteModalOpen = false"
             class="absolute inset-0 bg-black/60 backdrop-blur-xs"></div>

        <!-- Main Modal Container -->
        <div x-show="quoteModalOpen"
             x-transition:enter="transition-transform ease-out duration-300"
             x-transition:enter-start="translate-y-full"
             x-transition:enter-end="translate-y-0"
             x-transition:leave="transition-transform ease-in duration-300"
             x-transition:leave-start="translate-y-0"
             x-transition:leave-end="translate-y-full"
             class="absolute bottom-0 left-0 right-0 md:w-11/12 lg:w-4/5 xl:w-3/4 md:mx-auto h-[90vh] bg-white dark:bg-gray-950 rounded-t-3xl shadow-2xl flex flex-col overflow-hidden">
            
            <!-- Top App Bar -->
            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
                        <span class="icon-[ri--double-quotes-l] w-5 h-5"></span>
                    </div>
                    <div>
                        <h3 class="text-sm sm:text-base font-black text-gray-900 dark:text-white tracking-tight">Pusat Kutipan & Refleksi</h3>
                        <p class="text-[11px] text-gray-500 dark:text-gray-400">Jelajahi pemikiran pilihan berdasarkan kategori.</p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <!-- Search Bar di Header -->
                    <div class="relative w-40 sm:w-64">
                        <span class="icon-[ri--search-line] absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></span>
                        <input type="text" x-model="quoteSearch" placeholder="Cari kutipan/penulis..." 
                            class="w-full pl-9 pr-8 py-1.5 bg-gray-100 dark:bg-gray-800 border-none rounded-xl text-xs text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none transition">
                        <button x-show="quoteSearch.length > 0" @click="quoteSearch = ''" style="display: none;"
                            class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <span class="icon-[ri--close-circle-fill] w-3.5 h-3.5"></span>
                        </button>
                    </div>

                    <button @click="quoteModalOpen = false" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition cursor-pointer">
                        <span class="icon-[ri--close-line] w-5 h-5"></span>
                    </button>
                </div>
            </div>

            <!-- TOMBOL TRIGGER KATEGORI KHUSUS MOBILE (Hanya muncul di HP/Tablet kecil) -->
            <div class="md:hidden px-4 py-2.5 bg-white dark:bg-gray-900 border-b border-gray-100 dark:border-gray-800 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center gap-2 truncate">
                    <span class="text-[11px] text-gray-400 font-bold uppercase">Kategori Aktif:</span>
                    <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400 capitalize truncate" x-text="selectedCategoryQuote === '' ? 'Semua Kutipan' : getActiveCategoryTitle()"></span>
                </div>
                <button @click="mobileCategoryOpen = true" class="px-3 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 text-xs font-bold flex items-center gap-1.5 flex-shrink-0 cursor-pointer">
                    <span class="icon-[ri--filter-3-line] w-4 h-4"></span>
                    Pilih Kategori
                </button>
            </div>

            <!-- Body Area: Split Layout -->
            <div class="flex-1 flex overflow-hidden bg-gray-50/50 dark:bg-gray-950/50 relative">
                
                <!-- SIDEBAR KATEGORI (Desktop: Selalu tampil di kiri) -->
                <div class="hidden md:flex w-72 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 p-4 flex-col overflow-y-auto gap-1.5 flex-shrink-0">
                    <div class="pb-2 px-2 text-[10px] font-black uppercase tracking-wider text-gray-400">
                        Kategori Pilihan
                    </div>

                    <!-- Tombol Semua Kategori -->
                    <button @click="selectedCategoryQuote = ''"
                        :class="selectedCategoryQuote === '' ? 'bg-indigo-600 text-white shadow-xs font-bold' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800/60 font-medium'"
                        class="px-3.5 py-2.5 rounded-xl text-xs transition cursor-pointer flex items-center justify-between text-left">
                        <span class="flex items-center gap-2">
                            <span class="icon-[ri--apps-2-line] w-4 h-4"></span>
                            Semua Kutipan
                        </span>
                    </button>

                    <!-- List Kategori Desktop -->
                    <template x-for="(cat, catIndex) in quoteCategories" :key="'sidebar-cat-' + catIndex">
                        <button @click="selectedCategoryQuote = cat.slug"
                            :class="selectedCategoryQuote === cat.slug ? 'bg-indigo-600 text-white shadow-xs font-bold' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800/60 font-medium'"
                            class="px-3.5 py-2.5 rounded-xl text-xs transition cursor-pointer flex items-center justify-between text-left capitalize">
                            <span class="flex items-center gap-2 truncate">
                                <span class="icon-[ri--folder-3-line] w-4 h-4 opacity-70"></span>
                                <span class="truncate" x-text="cat.category_title"></span>
                            </span>
                            <span class="text-[10px] px-1.5 py-0.5 rounded-md bg-black/10 dark:bg-white/10 ml-2" x-text="cat.quotes ? cat.quotes.length : 0"></span>
                        </button>
                    </template>
                </div>

                <!-- OFFCANVAS / BOTTOM SHEET KATEGORI KHUSUS MOBILE -->
                <div x-show="mobileCategoryOpen" class="absolute inset-0 z-40 md:hidden flex flex-col justify-end" style="display: none;">
                    <!-- Backdrop Mobile Kategori -->
                    <div x-show="mobileCategoryOpen"
                         x-transition:enter="transition-opacity ease-out duration-200"
                         x-transition:enter-start="opacity-0"
                         x-transition:enter-end="opacity-100"
                         x-transition:leave="transition-opacity ease-in duration-150"
                         x-transition:leave-start="opacity-100"
                         x-transition:leave-end="opacity-0"
                         @click="mobileCategoryOpen = false"
                         class="absolute inset-0 bg-black/50 backdrop-blur-xs"></div>

                    <!-- Panel Bottom Sheet -->
                    <div x-show="mobileCategoryOpen"
                         x-transition:enter="transition-transform ease-out duration-300"
                         x-transition:enter-start="translate-y-full"
                         x-transition:enter-end="translate-y-0"
                         x-transition:leave="transition-transform ease-in duration-200"
                         x-transition:leave-start="translate-y-0"
                         x-transition:leave-end="translate-y-full"
                         class="relative bg-white dark:bg-gray-900 rounded-t-3xl shadow-2xl p-5 max-h-[75vh] flex flex-col z-50">
                        
                        <div class="flex items-center justify-between pb-4 border-b border-gray-100 dark:border-gray-800">
                            <h4 class="text-sm font-bold text-gray-900 dark:text-white flex items-center gap-2">
                                <span class="icon-[ri--folder-3-line] w-4 h-4 text-indigo-500"></span>
                                Pilih Kategori Kutipan
                            </h4>
                            <button @click="mobileCategoryOpen = false" class="text-gray-400 hover:text-gray-600 p-1.5 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">
                                <span class="icon-[ri--close-line] w-5 h-5"></span>
                            </button>
                        </div>

                        <!-- Daftar Kategori di Mobile Sheet -->
                        <div class="overflow-y-auto py-3 space-y-1.5">
                            <button @click="selectedCategoryQuote = ''; mobileCategoryOpen = false"
                                :class="selectedCategoryQuote === '' ? 'bg-indigo-600 text-white font-bold' : 'bg-gray-50 dark:bg-gray-800 text-gray-700 dark:text-gray-300'"
                                class="w-full px-4 py-3 rounded-xl text-xs transition flex items-center justify-between text-left">
                                <span class="flex items-center gap-2.5">
                                    <span class="icon-[ri--apps-2-line] w-4 h-4"></span>
                                    Semua Kutipan
                                </span>
                            </button>

                            <template x-for="(cat, catIndex) in quoteCategories" :key="'mob-cat-' + catIndex">
                                <button @click="selectedCategoryQuote = cat.slug; mobileCategoryOpen = false"
                                    :class="selectedCategoryQuote === cat.slug ? 'bg-indigo-600 text-white font-bold' : 'bg-gray-50 dark:bg-gray-800 text-gray-700 dark:text-gray-300'"
                                    class="w-full px-4 py-3 rounded-xl text-xs transition flex items-center justify-between text-left capitalize">
                                    <span class="flex items-center gap-2.5 truncate">
                                        <span class="icon-[ri--folder-3-line] w-4 h-4 opacity-70"></span>
                                        <span class="truncate" x-text="cat.category_title"></span>
                                    </span>
                                    <span class="text-[10px] px-2 py-0.5 rounded-md bg-black/10 dark:bg-white/10" x-text="cat.quotes ? cat.quotes.length : 0"></span>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- KONTEN UTAMA: Grid Kartu Kutipan -->
                <div class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6">
                    <template x-for="(categoryGroup, cgIndex) in filteredGroupedQuotes" :key="'cat-group-' + cgIndex">
                        <div class="space-y-3">
                            <!-- Judul Grup Kategori di dalam Konten -->
                            <div class="flex items-center justify-between px-1">
                                <h4 class="text-xs font-black uppercase tracking-wider text-indigo-600 dark:text-indigo-400 flex items-center gap-2">
                                    <span class="icon-[ri--bookmark-3-line] w-4 h-4"></span>
                                    <span x-text="categoryGroup.categoryTitle"></span>
                                </h4>
                                <span class="text-[10px] text-gray-400 font-semibold" x-text="categoryGroup.quotes.length + ' kutipan'"></span>
                            </div>

                            <!-- Grid Kartu -->
                            <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
                                <template x-for="(q, qIndex) in categoryGroup.quotes" :key="'quote-card-' + cgIndex + '-' + qIndex">
                                    <div class="relative bg-white dark:bg-gray-900 rounded-2xl p-5 border border-gray-100 dark:border-gray-800 shadow-2xs hover:shadow-md transition-all flex flex-col justify-between group overflow-hidden">
                                        <!-- Watermark Ikon Quote di Background Card -->
                                        <span class="icon-[ri--double-quotes-r] text-gray-100 dark:text-gray-800/40 w-24 h-24 absolute -bottom-4 -right-4 -z-0 pointer-events-none group-hover:scale-105 transition-transform"></span>

                                        <!-- Isi Teks Kutipan -->
                                        <div class="relative z-10 space-y-2 mb-4">
                                            <p class="text-xs sm:text-sm text-gray-800 dark:text-gray-200 leading-relaxed font-serif italic" x-text="`&ldquo;${q.text}&rdquo;`"></p>
                                        </div>

                                        <!-- Footer Kartu -->
                                        <div class="relative z-10 flex items-center justify-between text-[11px] pt-3 border-t border-gray-100 dark:border-gray-800/80">
                                            <span class="font-bold text-indigo-600 dark:text-indigo-400" x-text="q.author ? `— ${q.author}` : ''"></span>
                                            <span class="text-[10px] text-gray-400 bg-gray-50 dark:bg-gray-800 px-2 py-0.5 rounded-md" x-text="q.date ? q.date.split('T')[0] : ''"></span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- State Jika Kosong -->
                    <template x-if="filteredGroupedQuotes.length === 0">
                        <div class="text-center py-20 space-y-3">
                            <div class="w-12 h-12 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center mx-auto text-gray-400">
                                <span class="icon-[ri--search-eye-line] w-6 h-6"></span>
                            </div>
                            <p class="text-xs sm:text-sm font-bold text-gray-700 dark:text-gray-300">Tidak ada kutipan yang ditemukan</p>
                            <p class="text-xs text-gray-400">Coba ubah kata kunci pencarian atau pilih kategori lain.</p>
                        </div>
                    </template>
                </div>

            </div>

        </div>
    </div>
</div>

<script>
    function quotePlayerApp() {
        return {
            quoteCategories: [],
            currentQuote: { text: '', author: '' },
            quoteModalOpen: false,
            mobileCategoryOpen: false,
            quoteSearch: '',
            selectedCategoryQuote: '',

            init() {
                this.loadQuotes();
            },

            async loadQuotes() {
                try {
                    let quoteRes = await fetch('{{ "quote/index.json" | relURL }}').catch(() => null);
                    if (quoteRes && quoteRes.ok) {
                        let quoteData = await quoteRes.json();
                        if (quoteData && quoteData.categories) {
                            this.quoteCategories = quoteData.categories;
                            this.randomizeQuote();
                        }
                    }
                } catch (error) {
                    console.error('Gagal meload data quote:', error);
                }
            },

            randomizeQuote() {
                if (!this.quoteCategories || this.quoteCategories.length === 0) return;
                let allQuotes = this.quoteCategories.flatMap(cat => cat.quotes || []);
                if (allQuotes.length === 0) return;
                let randomIndex = Math.floor(Math.random() * allQuotes.length);
                this.currentQuote = allQuotes[randomIndex];
            },

            getActiveCategoryTitle() {
                let found = this.quoteCategories.find(cat => cat.slug === this.selectedCategoryQuote);
                return found ? found.category_title : 'Semua Kutipan';
            },

            get filteredGroupedQuotes() {
                let result = [];
                if (!this.quoteCategories) return result;

                this.quoteCategories.forEach(cat => {
                    if (this.selectedCategoryQuote !== '' && cat.slug !== this.selectedCategoryQuote) {
                        return;
                    }

                    let filteredQuotes = (cat.quotes || []).filter(q => {
                        let query = (this.quoteSearch || '').toLowerCase();
                        let matchesText = q.text && q.text.toLowerCase().includes(query);
                        let matchesAuthor = q.author && q.author.toLowerCase().includes(query);
                        return matchesText || matchesAuthor;
                    });

                    if (filteredQuotes.length > 0) {
                        result.push({
                            categoryTitle: cat.category_title,
                            categorySlug: cat.slug,
                            quotes: filteredQuotes
                        });
                    }
                });

                return result;
            }
        }
    }
</script>
