<div class="post-reactions" data-id='{{ .RelPermalink }}'>
    <div class="inline-flex gap-4 p-2 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
        <div class="reaction-item relative flex flex-col items-center p-2 cursor-pointer rounded-lg transition-colors hover:bg-gray-50 dark:hover:bg-gray-700 group" data-type="clap">
            <span class="icon-[twemoji--clapping-hands] w-8 h-8 mb-1 transition-transform duration-300 group-hover:scale-125 group-active:scale-95 group-active:rotate-12"></span>
            <span class="count reaction-loading text-sm font-semibold text-gray-900 dark:text-white transition-all duration-200">0</span> 
        </div>

        <div class="reaction-item relative flex flex-col items-center p-2 cursor-pointer rounded-lg transition-colors hover:bg-gray-50 dark:hover:bg-gray-700 group" data-type="wow">
            <span class="icon-[twemoji--astonished-face] w-8 h-8 mb-1 transition-transform duration-300 group-hover:scale-125 group-active:scale-95 group-active:-rotate-12"></span>
            <span class="count reaction-loading text-sm font-semibold text-gray-900 dark:text-white transition-all duration-200">0</span>
        </div>

        <div class="reaction-item relative flex flex-col items-center p-2 cursor-pointer rounded-lg transition-colors hover:bg-gray-50 dark:hover:bg-gray-700 group" data-type="hmm">
            <span class="icon-[twemoji--thinking-face] w-8 h-8 mb-1 transition-transform duration-300 group-hover:scale-125 group-active:scale-95 group-active:rotate-6"></span>
            <span class="count reaction-loading text-sm font-semibold text-gray-900 dark:text-white transition-all duration-200">0</span>
        </div>
    </div>
</div>
