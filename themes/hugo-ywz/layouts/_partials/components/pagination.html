{{ $paginator := .Paginator }}
{{ if gt $paginator.TotalPages 1 }}
<nav class="flex items-center justify-between" aria-label="Pagination">
    <div class="flex-1 flex justify-between sm:justify-center gap-4">
        {{ if $paginator.HasPrev }}
            <a href="{{ $paginator.Prev.URL }}" class="relative inline-flex items-center px-4 py-2 border border-gray-300 dark:border-gray-700 text-sm font-medium rounded-md text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                &larr; Halaman Baru
            </a>
        {{ end }}
        {{ if $paginator.HasNext }}
            <a href="{{ $paginator.Next.URL }}" class="relative inline-flex items-center px-4 py-2 border border-gray-300 dark:border-gray-700 text-sm font-medium rounded-md text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                Halaman Lama &rarr;
            </a>
        {{ end }}
    </div>
</nav>
{{ end }}
