<!-- Offcanvas: mobile categories -->
<div x-show="categoryOpen" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style="display: none;">
    <div @click="categoryOpen = false" class="fixed inset-0 bg-black/60 backdrop-blur-xs"></div>
    <div class="relative w-full max-w-lg bg-white dark:bg-gray-900 rounded-t-3xl sm:rounded-2xl shadow-2xl p-5 z-10 border-t sm:border border-gray-200 dark:border-gray-800 max-h-[80vh] flex flex-col">
        <div class="flex items-center justify-between pb-3 border-b border-gray-100 dark:border-gray-800 mb-3">
            <h3 class="text-sm font-bold text-gray-900 dark:text-white">Pilih Kategori Prompt</h3>
            <button @click="categoryOpen = false" class="text-gray-400 hover:text-gray-600 p-1.5 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 cursor-pointer">
                <span class="icon-[ri--close-line] w-4 h-4"></span>
            </button>
        </div>
        <div class="space-y-1 overflow-y-auto pr-1 flex-grow">
            <template x-for="cat in categoryItems" :key="cat.slug">
                <button @click="selectCategory(cat.slug); categoryOpen = false"
                        class="w-full px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all cursor-pointer flex items-center justify-between"
                        :class="selectedCategory === cat.slug ? 'bg-indigo-600 text-white shadow-xs shadow-indigo-500/20' : 'text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-gray-800/50 hover:bg-gray-100 dark:hover:bg-gray-800'">
                    <span class="flex items-center gap-2.5 truncate">
                        <span :class="cat.icon" class="w-4 h-4 flex-shrink-0"></span>
                        <span class="truncate" x-text="cat.title"></span>
                    </span>
                    <span class="px-2 py-0.5 rounded-full text-[10px] flex-shrink-0"
                          :class="selectedCategory === cat.slug ? 'bg-white/20 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300'"
                          x-text="cat.count"></span>
                </button>
            </template>
        </div>
    </div>
</div>
