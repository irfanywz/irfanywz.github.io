<!-- AI result panel (right column, only when use_ai: true) -->
<template x-if="useAi">
    <div x-ref="aiPanel" class="relative min-w-0 min-h-0 flex-1 flex-col bg-white dark:bg-gray-900 overflow-hidden"
         :class="aiPane === 'form' ? 'hidden lg:flex' : 'flex'">
        <div class="flex items-center justify-between gap-2 px-4 h-11 border-b border-gray-200 dark:border-gray-800 flex-shrink-0">
            <div class="flex items-center gap-1 min-w-0">
                <button @click="aiPane = 'result'" class="hidden lg:block px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer"
                        :class="aiPane !== 'prompt' ? 'bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400' : 'text-gray-500 hover:text-gray-700 dark:hover:text-gray-200'">Hasil</button>
                <button @click="aiPane = 'prompt'" class="hidden lg:block px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer"
                        :class="aiPane === 'prompt' ? 'bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400' : 'text-gray-500 hover:text-gray-700 dark:hover:text-gray-200'">Prompt</button>
                <span class="lg:hidden text-sm font-bold text-gray-900 dark:text-white" x-text="aiPane === 'prompt' ? 'Prompt' : 'Hasil'"></span>
            </div>
            <div class="flex items-center gap-1">
                <select x-model="aiFormatChoice" x-show="aiPane !== 'prompt'" title="Format tampilan hasil"
                        class="text-[11px] font-semibold bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 rounded-lg px-1.5 py-0.5 outline-none cursor-pointer">
                    <option value="auto">Auto</option>
                    <option value="cards">Kartu</option>
                    <option value="text">Teks</option>
                    <option value="markdown">Markdown</option>
                    <option value="json">JSON</option>
                </select>
                <button x-show="aiOutput && aiPane !== 'prompt'" @click="copy(aiView.text, 'copiedAi')" style="display: none;"
                        class="text-[11px] text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 font-semibold flex items-center gap-1 cursor-pointer bg-gray-100 dark:bg-gray-800 px-2 py-0.5 rounded-lg transition">
                    <span :class="copiedAi ? 'icon-[ri--check-line]' : 'icon-[ri--file-copy-line]'"></span>
                    <span x-text="copiedAi ? 'Tersalin' : 'Salin Hasil'"></span>
                </button>
                <button @click="aiHistoryOpen = !aiHistoryOpen; aiShowSettings = false" title="Riwayat hasil"
                        class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 cursor-pointer flex items-center gap-0.5">
                    <span class="icon-[ri--history-line] text-sm"></span>
                    <span x-show="aiHistoryCount" style="display: none;" class="text-[10px] font-bold" x-text="aiHistoryCount"></span>
                </button>
                <button @click="aiShowSettings = !aiShowSettings; aiHistoryOpen = false" title="Pengaturan AI"
                        class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 cursor-pointer">
                    <span class="icon-[ri--settings-3-line] text-sm"></span>
                </button>
            </div>
        </div>

        <div x-ref="aiBody" x-show="aiPane !== 'prompt'" class="flex-1 min-h-0 overflow-y-auto p-4">
            <p x-show="aiError" style="display: none;" class="text-xs font-semibold text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/30 border border-red-100 dark:border-red-900/50 rounded-lg px-3 py-2 mb-3" x-text="aiError"></p>
            <p x-show="aiView.partial && !aiLoading" style="display: none;" class="text-[11px] font-semibold text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/30 border border-amber-100 dark:border-amber-900/50 rounded-lg px-3 py-2 mb-3">Respons JSON tidak lengkap atau terpotong, jadi tampilan ini hasil perbaikan otomatis. Pilih format Teks untuk melihat respons aslinya.</p>
            <div x-show="aiView.kind === 'html' && aiView.html" style="display: none;" class="text-xs sm:text-sm text-gray-800 dark:text-gray-200 leading-relaxed break-words" x-html="aiView.html"></div>
            <div x-show="aiView.kind === 'cards'" style="display: none;" class="space-y-3">
                <p x-show="aiView.heading" style="display: none;" class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400" x-text="aiView.heading"></p>
                <template x-for="(card, i) in (aiView.cards || [])" :key="i">
                    <div class="border border-gray-200 dark:border-gray-700 rounded-xl bg-white dark:bg-gray-900 overflow-hidden">
                        <div class="flex items-center justify-between gap-2 px-3 py-2 bg-gray-50 dark:bg-gray-950/50 border-b border-gray-200 dark:border-gray-700">
                            <div class="flex items-center gap-2 min-w-0">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400" x-text="'#' + (i + 1)"></span>
                                <span x-show="card.title" style="display: none;" class="text-xs font-bold text-gray-800 dark:text-gray-200 truncate" x-text="card.title"></span>
                            </div>
                            <button @click="copy(card.text, 'copiedAiItem', 'c' + i)" class="text-[11px] text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 font-semibold flex items-center gap-1 cursor-pointer shrink-0">
                                <span :class="copiedAiItem === 'c' + i ? 'icon-[ri--check-line]' : 'icon-[ri--file-copy-line]'"></span>
                                <span x-text="copiedAiItem === 'c' + i ? 'Tersalin' : 'Salin kartu'"></span>
                            </button>
                        </div>
                        <div class="divide-y divide-gray-100 dark:divide-gray-800">
                            <template x-for="(field, j) in card.fields" :key="j">
                                <div class="px-3 py-2.5 space-y-1">
                                    <div x-show="field.label" style="display: none;" class="flex items-center justify-between gap-2">
                                        <span class="text-[10px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400" x-text="field.label"></span>
                                        <button x-show="card.fields.length > 1" style="display: none;" @click="copy(field.text, 'copiedAiItem', 'f' + i + '.' + j)" class="text-[11px] text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 font-semibold flex items-center gap-1 cursor-pointer">
                                            <span :class="copiedAiItem === 'f' + i + '.' + j ? 'icon-[ri--check-line]' : 'icon-[ri--file-copy-line]'"></span>
                                            <span x-text="copiedAiItem === 'f' + i + '.' + j ? 'Tersalin' : 'Salin'"></span>
                                        </button>
                                    </div>
                                    <div x-show="field.type === 'chips'" style="display: none;" class="flex flex-wrap gap-1.5">
                                        <template x-for="(chip, k) in (field.items || [])" :key="k">
                                            <span class="px-2 py-0.5 rounded-full bg-indigo-50 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-300 text-[11px] font-medium" x-text="chip"></span>
                                        </template>
                                    </div>
                                    <pre x-show="field.type === 'code'" style="display: none;" class="font-mono text-[11px] text-gray-700 dark:text-gray-300 whitespace-pre-wrap break-words" x-text="field.text"></pre>
                                    <p x-show="field.type === 'text'" class="text-xs sm:text-sm text-gray-800 dark:text-gray-200 leading-relaxed whitespace-pre-wrap break-words" x-text="field.text"></p>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
            <div x-show="aiLoading && !aiOutput" style="display: none;" class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
                <span class="icon-[ri--loader-4-line] animate-spin motion-reduce:animate-none"></span>
                <span>Menunggu respons AI...</span>
            </div>
            <div x-show="!aiOutput && !aiLoading && !aiError" class="h-full flex flex-col items-center justify-center text-center gap-1.5 py-10">
                <div class="w-10 h-10 rounded-full bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 flex items-center justify-center mb-1.5">
                    <span class="icon-[ri--sparkling-2-line] text-lg"></span>
                </div>
                <p class="text-sm font-bold text-gray-900 dark:text-white">Belum ada hasil</p>
                <p class="text-xs text-gray-500 dark:text-gray-400 max-w-xs leading-relaxed">Isi parameter, lalu tekan Generate. Hasil muncul di sini.</p>
            </div>
        </div>

        <div x-show="aiPane === 'prompt'" style="display: none;" class="flex-1 min-h-0 overflow-y-auto p-4 space-y-3">
            {{ partial "components/prompt-app/detail-form-preview.html" . }}
            <button @click="copy(regularPromptRaw, 'copiedMaster')" class="px-4 py-2 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 text-xs font-bold rounded-xl flex items-center gap-2 cursor-pointer">
                <span :class="copiedMaster ? 'icon-[ri--check-line]' : 'icon-[ri--file-copy-line]'"></span>
                <span x-text="copiedMaster ? 'Prompt berhasil disalin' : 'Salin prompt'"></span>
            </button>
        </div>

        <div x-show="aiOutput && aiPane !== 'prompt'" style="display: none;" class="px-3.5 py-2 border-t border-gray-200 dark:border-gray-800 text-[11px] text-gray-500 dark:text-gray-400 flex flex-wrap items-center justify-between gap-x-3 gap-y-1">
            <span x-text="formatStats(aiOutput)"></span>
        </div>

        {{ partial "components/prompt-app/ai-settings.html" . }}

        {{ partial "components/prompt-app/ai-history.html" . }}

    </div>
</template>
