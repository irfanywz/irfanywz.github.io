<!-- Modal: prompt detail -->
<div x-show="modalOpen" class="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center" :class="splitLayout ? 'p-0 sm:p-6' : 'px-4 py-6 sm:p-0'" style="display: none;">
    <div @click="closeModal()" class="fixed inset-0 bg-black/60 backdrop-blur-xs"></div>

    <div class="relative w-full bg-white dark:bg-gray-900 shadow-2xl z-10 border border-gray-200 dark:border-gray-800 my-auto transition-[max-width] duration-200"
         :class="splitLayout ? 'max-w-6xl h-[100dvh] sm:h-[min(860px,calc(100dvh-3rem))] flex flex-col overflow-hidden sm:rounded-2xl' : 'max-w-2xl p-5 sm:p-6 rounded-2xl'">

        <div x-show="isLoadingDetail" role="status" :class="splitLayout ? 'p-5' : ''">
            <span class="sr-only">Mengambil data prompt...</span>
            <div class="animate-pulse motion-reduce:animate-none space-y-4" aria-hidden="true">
                <div class="space-y-2">
                    <div class="h-5 w-1/2 rounded bg-gray-200 dark:bg-gray-800"></div>
                    <div class="h-3 w-3/4 rounded bg-gray-200 dark:bg-gray-800"></div>
                </div>
                <div class="h-40 rounded-xl bg-gray-200 dark:bg-gray-800"></div>
                <div class="h-10 w-full sm:w-44 ml-auto rounded-xl bg-gray-200 dark:bg-gray-800"></div>
            </div>
        </div>

        <div x-show="!isLoadingDetail" style="display: none;" :class="splitLayout ? 'flex flex-col flex-1 min-h-0' : 'space-y-4'">
            <template x-if="useAi">
                {{ partial "components/prompt-app/detail-ai-header.html" . }}
            </template>
            <template x-if="!useAi">
                <div class="flex items-start justify-between gap-3 mb-1">
                    <div>
                        <h3 class="text-base sm:text-lg font-bold text-gray-900 dark:text-white" x-text="activePrompt.title"></h3>
                        <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5" x-text="activePrompt.description"></p>
                    </div>
                    {{ partial "components/prompt-app/detail-header-actions.html" . }}
                </div>
            </template>

            {{ partial "components/prompt-app/detail-database.html" . }}

            <!-- B: regular prompt with dynamic form (use_ai: two-pane dialog, otherwise the compact form) -->
            <template x-if="!activePrompt.has_database">
                <div :class="useAi ? 'flex flex-col flex-1 min-h-0' : ''">
                    <template x-if="useAi">
                        {{ partial "components/prompt-app/detail-ai-layout.html" . }}
                    </template>
                    <template x-if="!useAi">
                        {{ partial "components/prompt-app/detail-form.html" . }}
                    </template>
                </div>
            </template>
        </div>
    </div>
</div>
