<div class="flex items-center gap-1.5 flex-shrink-0">
    <button x-show="promptResources.length" style="display: none;" @click="openResources('prompt')"
            class="px-2.5 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 text-[11px] font-bold text-gray-700 dark:text-gray-200 hover:text-indigo-600 dark:hover:text-indigo-400 transition cursor-pointer flex items-center gap-1.5">
        <span class="icon-[ri--folder-shared-line] text-sm"></span>
        <span x-text="'Resource (' + promptResources.length + ')'"></span>
    </button>
    <button @click="closeModal()" class="text-gray-400 hover:text-gray-600 p-1.5 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition cursor-pointer">
        <span class="icon-[ri--close-line] w-4 h-4"></span>
    </button>
</div>
