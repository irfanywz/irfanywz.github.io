<div x-ref="aiSplit" class="flex flex-col lg:flex-row flex-1 min-h-0" :style="'--pane-w:' + formPaneWidth + 'px'"
     :class="paneDragging ? 'select-none cursor-col-resize' : ''">
    <div class="lg:hidden flex flex-shrink-0 border-b border-gray-200 dark:border-gray-800">
    <button @click="aiPane = 'form'" class="flex-1 py-2.5 text-xs font-bold border-b-2 cursor-pointer"
            :class="aiPane === 'form' ? 'border-indigo-600 text-indigo-600 dark:border-indigo-400 dark:text-indigo-400' : 'border-transparent text-gray-500 dark:text-gray-400'">Isian</button>
    <button @click="aiPane = 'result'" class="flex-1 py-2.5 text-xs font-bold border-b-2 cursor-pointer"
            :class="aiPane === 'result' ? 'border-indigo-600 text-indigo-600 dark:border-indigo-400 dark:text-indigo-400' : 'border-transparent text-gray-500 dark:text-gray-400'">Hasil</button>
    <button @click="aiPane = 'prompt'" class="flex-1 py-2.5 text-xs font-bold border-b-2 cursor-pointer"
            :class="aiPane === 'prompt' ? 'border-indigo-600 text-indigo-600 dark:border-indigo-400 dark:text-indigo-400' : 'border-transparent text-gray-500 dark:text-gray-400'">Prompt</button>
    </div>

    <div class="flex-1 min-h-0 flex-col lg:flex-none lg:w-[var(--pane-w)] lg:min-w-[280px] lg:max-w-[70%] bg-gray-50 dark:bg-gray-950/60"
         :class="aiPane === 'form' ? 'flex' : 'hidden lg:flex'">
        <div class="flex-1 min-h-0 overflow-y-auto p-4">
            {{ partial "components/prompt-app/detail-form-fields.html" . }}
            <p x-show="promptFields.length === 0" style="display: none;" class="text-xs text-gray-500 dark:text-gray-400 leading-relaxed">Prompt ini tidak punya parameter. Tekan Generate untuk menjalankannya.</p>
        </div>
        <div class="flex-shrink-0 border-t border-gray-200 dark:border-gray-800 p-3 space-y-2.5">
            <div class="flex items-center justify-between gap-2">
                <p class="text-[11px] text-gray-500 dark:text-gray-400" title="Perkiraan kasar (±4 karakter per token). Jumlah sebenarnya tergantung model." x-text="formatStats(regularPromptRaw)"></p>
                <button @click="copy(regularPromptRaw, 'copiedMaster')" class="text-[11px] font-semibold text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 flex items-center gap-1 cursor-pointer">
                    <span :class="copiedMaster ? 'icon-[ri--check-line]' : 'icon-[ri--file-copy-line]'"></span>
                    <span x-text="copiedMaster ? 'Tersalin' : 'Salin prompt'"></span>
                </button>
            </div>
            <button @click="generateAi()"
                    class="w-full px-5 py-3 text-white text-xs font-bold rounded-xl transition-all shadow-xs flex items-center justify-center gap-2 cursor-pointer"
                    :class="aiLoading ? 'bg-red-600 hover:bg-red-500' : 'bg-indigo-600 hover:bg-indigo-500'">
                <span :class="aiLoading ? 'icon-[ri--stop-circle-line]' : 'icon-[ri--sparkling-2-fill]'" class="w-4 h-4"></span>
                <span x-text="aiLoading ? 'Hentikan' : (aiOutput ? 'Generate Ulang' : 'Generate dengan AI')"></span>
            </button>
        </div>
    </div>

    <div class="hidden lg:flex flex-none w-2 -mx-px cursor-col-resize justify-center touch-none group focus:outline-none"
         role="separator" aria-orientation="vertical" aria-label="Ubah lebar panel isian (tarik, atau pakai tombol panah kiri dan kanan)" tabindex="0"
         title="Tarik untuk mengubah lebar. Klik dua kali untuk reset." :aria-valuenow="formPaneWidth" aria-valuemin="280" aria-valuemax="720"
         @pointerdown.prevent="startPaneResize($event)" @pointermove="movePaneResize($event)" @pointerup="endPaneResize($event)"
         @pointercancel="endPaneResize($event)" @lostpointercapture="endPaneResize($event)" @dblclick="resetPaneWidth()"
         @keydown.arrow-left.prevent="resizePaneBy(-24)" @keydown.arrow-right.prevent="resizePaneBy(24)" @keydown.home.prevent="resetPaneWidth()">
        <div class="transition-colors"
             :class="paneDragging ? 'w-0.5 bg-indigo-500' : 'w-px bg-gray-200 dark:bg-gray-800 group-hover:bg-indigo-400 group-focus-visible:bg-indigo-500'"></div>
    </div>

    {{ partial "components/prompt-app/ai-panel.html" . }}
</div>
