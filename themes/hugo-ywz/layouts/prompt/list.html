{{ define "main" }}
<div class="max-w-6xl mx-auto px-4 py-8" x-data="promptListApp()">
    
    <!-- Header Section -->
    <div class="mb-8">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 dark:text-white" x-text="pageData.section || 'Kumpulan Prompt'"></h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1.5" x-text="pageData.description || 'Pilih prompt berdasarkan kategori di bawah ini.'"></p>
    </div>

    <!-- Loading State Awal -->
    <div x-show="isLoadingList" class="flex justify-center items-center py-20">
        <span class="icon-[ri--loader-4-line] animate-spin text-3xl text-indigo-600"></span>
    </div>

    <!-- Main Content List -->
    <div x-show="!isLoadingList" style="display: none;" class="space-y-10">
        <template x-for="category in pageData.categories" :key="category.category">
            <div class="space-y-4">
                <!-- Judul Kategori -->
                <div class="flex items-center gap-2 border-b border-gray-200 dark:border-gray-800 pb-2">
                    <span class="icon-[ri--folder-3-line] text-indigo-500 w-5 h-5"></span>
                    <h2 class="text-lg font-bold text-gray-900 dark:text-white" x-text="category.category_title || category.category"></h2>
                    <span class="text-xs bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 px-2 py-0.5 rounded-full font-medium ml-2" x-text="category.prompts.length + ' Prompt'"></span>
                </div>

                <!-- Grid Kartu Prompt -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <template x-for="prompt in category.prompts" :key="prompt.json_url">
                        <div @click="openPromptDetail(prompt.json_url)" 
                             class="group bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl p-5 hover:border-indigo-500 dark:hover:border-indigo-500 transition-all shadow-xs hover:shadow-md cursor-pointer flex flex-col justify-between">
                            <div>
                                <h3 class="text-sm sm:text-base font-bold text-gray-900 dark:text-white group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors line-clamp-1" x-text="prompt.title"></h3>
                                <p class="text-xs text-gray-500 dark:text-gray-400 mt-2 line-clamp-2 leading-relaxed" x-text="prompt.description"></p>
                            </div>
                            <div class="mt-4 pt-3 border-t border-gray-100 dark:border-gray-800/60 flex items-center justify-between text-xs font-semibold text-indigo-600 dark:text-indigo-400">
                                <span>Gunakan Prompt</span>
                                <span class="icon-[ri--arrow-right-line] group-hover:translate-x-1 transition-transform"></span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>

    <!-- Modal Detail Prompt (Muncul pas diklik) -->
    <div x-show="modalOpen" class="fixed inset-0 z-50 overflow-y-auto" style="display: none;">
        <!-- Backdrop -->
        <div x-show="modalOpen"
             x-transition:enter="transition-opacity ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition-opacity ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             @click="modalOpen = false"
             class="fixed inset-0 bg-black/60 backdrop-blur-xs"></div>

        <!-- Modal Box -->
        <div class="flex min-h-full items-center justify-center p-4">
            <div x-show="modalOpen"
                 x-transition:enter="transition-transform ease-out duration-300"
                 x-transition:enter-start="scale-95 opacity-0"
                 x-transition:enter-end="scale-100 opacity-100"
                 x-transition:leave="transition-transform ease-in duration-200"
                 x-transition:leave-start="scale-100 opacity-100"
                 x-transition:leave-end="scale-95 opacity-0"
                 class="relative w-full max-w-2xl bg-white dark:bg-gray-900 rounded-3xl shadow-2xl p-6 sm:p-8 overflow-hidden z-10 border border-gray-200 dark:border-gray-800">
                
                <!-- Loading Detail State -->
                <div x-show="isLoadingDetail" class="flex flex-col items-center justify-center py-12">
                    <span class="icon-[ri--loader-4-line] animate-spin text-3xl text-indigo-600"></span>
                    <p class="text-xs text-gray-400 mt-2">Memuat isi prompt...</p>
                </div>

                <!-- Konten Detail Loaded -->
                <div x-show="!isLoadingDetail" style="display: none;">
                    <div class="flex items-start justify-between gap-4 mb-4">
                        <h3 class="text-lg sm:text-xl font-bold text-gray-900 dark:text-white" x-text="activePrompt.title"></h3>
                        <button @click="modalOpen = false" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition cursor-pointer flex-shrink-0">
                            <span class="icon-[ri--close-line] w-5 h-5"></span>
                        </button>
                    </div>

                    <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mb-6" x-text="activePrompt.description"></p>

                    <!-- Render HTML Content dari Markdown -->
                    <div class="bg-gray-50 dark:bg-gray-950 p-4 sm:p-5 rounded-2xl border border-gray-200 dark:border-gray-800 text-sm text-gray-800 dark:text-gray-200 leading-relaxed font-mono select-all overflow-x-auto mb-6"
                         x-html="activePrompt.content"></div>

                    <!-- Tombol Aksi (Copy Prompt) -->
                    <div class="flex justify-end gap-3">
                        <button @click="copyPromptContent()" 
                                class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl transition-all shadow-md flex items-center gap-2 cursor-pointer">
                            <span :class="copied ? 'icon-[ri--check-line]' : 'icon-[ri--file-copy-line]'" class="w-4 h-4"></span>
                            <span x-text="copied ? 'Berhasil Disalin!' : 'Salin Prompt'"></span>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('promptListApp', () => ({
        pageData: {},
        isLoadingList: true,
        modalOpen: false,
        isLoadingDetail: false,
        activePrompt: {},
        copied: false,

        async init() {
            try {
                // Mengambil list index JSON utama
                let res = await fetch('./index.json');
                if (res.ok) {
                    this.pageData = await res.json();
                }
            } catch (e) {
                console.error("Gagal memuat index prompt:", e);
            } finally {
                this.isLoadingList = false;
            }
        },

        async openPromptDetail(jsonUrl) {
            this.modalOpen = true;
            this.isLoadingDetail = true;
            this.copied = false;
            
            try {
                let res = await fetch(jsonUrl);
                if (res.ok) {
                    this.activePrompt = await res.json();
                }
            } catch (e) {
                console.error("Gagal memuat detail prompt:", e);
            } finally {
                this.isLoadingDetail = false;
            }
        },

        copyPromptContent() {
            // Mengambil teks bersih dari elemen HTML konten markdown
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = this.activePrompt.content || '';
            const textToCopy = tempDiv.textContent || tempDiv.innerText || '';

            navigator.clipboard.writeText(textToCopy).then(() => {
                this.copied = true;
                setTimeout(() => { this.copied = false; }, 2000);
            });
        }
    }));
});
</script>
{{ end }}
