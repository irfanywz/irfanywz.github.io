{{ define "head" }}
{{ end }}

{{ define "main" }}
    <main class="flex-grow bg-white dark:bg-gray-900 transition-colors duration-300" 
          x-data="journalApp()" 
          x-init="initData()">
        
        <!-- Container Utama (Margin & Padding Nol di Mobile, Normal di Desktop) -->
        <div class="container max-w-6xl mx-auto px-0 sm:px-6 lg:px-8 py-4 sm:py-8 md:py-12">
            
            <!-- ========================================== -->
            <!-- SKELETON LOADING STATE (Pakai animate-pulse)-->
            <!-- ========================================== -->
            <div x-show="loading" class="animate-pulse flex flex-col lg:flex-row gap-6 lg:gap-12 items-start px-4 sm:px-0">
                
                <!-- Skeleton Sidebar Kiri -->
                <aside class="w-full lg:w-80 flex-shrink-0 space-y-6">
                    <div class="border-b border-gray-100 dark:border-gray-800 pb-4 lg:pb-6 space-y-3">
                        <div class="h-8 bg-gray-200 dark:bg-gray-800 rounded-lg w-2/3"></div>
                        <div class="h-4 bg-gray-100 dark:bg-gray-800/60 rounded-md w-full"></div>
                        <div class="h-4 bg-gray-100 dark:bg-gray-800/60 rounded-md w-4/5"></div>
                        <div class="h-7 bg-gray-200 dark:bg-gray-800 rounded-lg w-1/2 mt-3"></div>
                    </div>

                    <!-- Skeleton Search Bar -->
                    <div class="h-10 bg-gray-200 dark:bg-gray-800 rounded-xl w-full"></div>

                    <!-- Skeleton Filter Tahun -->
                    <div class="space-y-2">
                        <div class="h-3 bg-gray-200 dark:bg-gray-800 rounded w-1/3 hidden lg:block"></div>
                        <div class="flex lg:flex-col gap-2 overflow-hidden">
                            <div class="h-9 bg-gray-200 dark:bg-gray-800 rounded-xl w-28 lg:w-full flex-shrink-0"></div>
                            <div class="h-9 bg-gray-100 dark:bg-gray-800/60 rounded-xl w-24 lg:w-full flex-shrink-0"></div>
                            <div class="h-9 bg-gray-100 dark:bg-gray-800/60 rounded-xl w-24 lg:w-full flex-shrink-0"></div>
                        </div>
                    </div>
                </aside>

                <!-- Skeleton Stream Konten Kanan -->
                <div class="flex-grow w-full space-y-6">
                    <!-- Skeleton Group Bulan 1 -->
                    <div class="p-0 sm:p-5 md:p-6 sm:rounded-2xl bg-transparent sm:bg-gray-50/50 sm:dark:bg-gray-800/20 sm:border border-gray-100 dark:border-gray-800 space-y-4">
                        <div class="h-4 bg-gray-200 dark:bg-gray-800 rounded w-28 mb-3"></div>
                        <div class="space-y-3">
                            <div class="flex items-center gap-4 py-2">
                                <div class="w-9 h-11 bg-gray-200 dark:bg-gray-800 rounded-lg flex-shrink-0"></div>
                                <div class="flex-grow space-y-2">
                                    <div class="h-4 bg-gray-200 dark:bg-gray-800 rounded w-3/4"></div>
                                    <div class="h-3 bg-gray-100 dark:bg-gray-800/60 rounded w-1/2"></div>
                                </div>
                            </div>
                            <div class="flex items-center gap-4 py-2">
                                <div class="w-9 h-11 bg-gray-200 dark:bg-gray-800 rounded-lg flex-shrink-0"></div>
                                <div class="flex-grow space-y-2">
                                    <div class="h-4 bg-gray-200 dark:bg-gray-800 rounded w-2/3"></div>
                                    <div class="h-3 bg-gray-100 dark:bg-gray-800/60 rounded w-1/3"></div>
                                </div>
                            </div>
                            <div class="flex items-center gap-4 py-2">
                                <div class="w-9 h-11 bg-gray-200 dark:bg-gray-800 rounded-lg flex-shrink-0"></div>
                                <div class="flex-grow space-y-2">
                                    <div class="h-4 bg-gray-200 dark:bg-gray-800 rounded w-4/5"></div>
                                    <div class="h-3 bg-gray-100 dark:bg-gray-800/60 rounded w-2/5"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Skeleton Group Bulan 2 -->
                    <div class="p-0 sm:p-5 md:p-6 sm:rounded-2xl bg-transparent sm:bg-gray-50/50 sm:dark:bg-gray-800/20 sm:border border-gray-100 dark:border-gray-800 space-y-4">
                        <div class="h-4 bg-gray-200 dark:bg-gray-800 rounded w-24 mb-3"></div>
                        <div class="space-y-3">
                            <div class="flex items-center gap-4 py-2">
                                <div class="w-9 h-11 bg-gray-200 dark:bg-gray-800 rounded-lg flex-shrink-0"></div>
                                <div class="flex-grow space-y-2">
                                    <div class="h-4 bg-gray-200 dark:bg-gray-800 rounded w-3/5"></div>
                                    <div class="h-3 bg-gray-100 dark:bg-gray-800/60 rounded w-1/4"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Layout Split Screen (Muncul setelah data JSON ter-load) -->
            <div x-show="!loading" style="display: none;" class="flex flex-col lg:flex-row gap-6 lg:gap-12 items-start">
                
                <!-- ========================================== -->
                <!-- SIDEBAR KIRI (Sticky di Desktop)           -->
                <!-- ========================================== -->
                <aside class="w-full lg:w-80 flex-shrink-0 px-4 sm:px-0 lg:sticky lg:top-8 space-y-6">
                    
                    <!-- Title & Description -->
                    <div class="border-b border-gray-100 dark:border-gray-800 pb-4 lg:pb-6">
                        <h1 class="text-2xl sm:text-3xl font-black text-gray-900 dark:text-white mb-1.5 tracking-tight flex items-center gap-2.5">
                            <span class="icon-[lucide--receipt-text] text-green-600 w-7 h-7 sm:w-8 sm:h-8"></span>
                            {{.Title}}
                        </h1>
                        {{ if .Description }}
                            <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 leading-relaxed">{{ .Description }}</p>
                        {{ end }}

                        <!-- Stat Badge Ringkas -->
                        <div class="mt-4 inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 text-xs font-semibold border border-indigo-100 dark:border-indigo-900/60">
                            <span class="icon-[ri--book-read-line] w-4 h-4"></span>
                            <span>Total <strong x-text="journals.length"></strong> Catatan Jurnal</span>
                        </div>
                    </div>

                    <!-- Input Pencarian -->
                    <div class="relative w-full">
                        <i class="icon-[ri--search-line] absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                        <input type="text" x-model="search" placeholder="Cari di jurnal..." 
                            class="w-full pl-10 pr-9 py-2.5 bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-xs sm:text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all shadow-2xs">
                        <button x-show="search.length > 0" @click="search = ''"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors" style="display: none;">
                            <span class="icon-[ri--close-circle-fill] w-4 h-4"></span>
                        </button>
                    </div>

                    <!-- Filter Tahun: Horizontal Scroll di Mobile, Vertical List di Desktop -->
                    <div class="space-y-2">
                        <label class="hidden lg:block text-xs font-bold text-gray-400 uppercase tracking-wider">
                            Filter Tahun
                        </label>

                        <!-- Wrapper untuk Mobile (Horizontal Scroll) & Desktop (Vertical Stack) -->
                        <div class="flex lg:flex-col items-center lg:items-stretch gap-2 overflow-x-auto scrollbar-none pb-2 lg:pb-0 -mx-4 px-4 sm:mx-0 sm:px-0">
                            
                            <!-- Tombol Semua -->
                            <button @click="selectedYear = ''"
                                :class="selectedYear === '' ? 'bg-indigo-600 text-white shadow-xs' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700/80'"
                                class="w-auto lg:w-full px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all whitespace-nowrap flex-shrink-0 flex items-center justify-between gap-3">
                                <span class="flex items-center gap-2">
                                    <span class="icon-[ri--archive-drawer-line] w-4 h-4"></span>
                                    <span>Semua Tahun</span>
                                </span>
                                <span class="px-2 py-0.5 rounded-md text-[10px] font-bold"
                                      :class="selectedYear === '' ? 'bg-indigo-500/40 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-500 dark:text-gray-400'"
                                      x-text="journals.length"></span>
                            </button>

                            <!-- Loop Tahun -->
                            <template x-for="year in availableYears" :key="year">
                                <button @click="selectedYear = year"
                                    :class="selectedYear === year ? 'bg-indigo-600 text-white shadow-xs' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700/80'"
                                    class="w-auto lg:w-full px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all whitespace-nowrap flex-shrink-0 flex items-center justify-between gap-3">
                                    <span class="flex items-center gap-2">
                                        <span class="icon-[ri--calendar-line] w-4 h-4"></span>
                                        <span x-text="year"></span>
                                    </span>
                                    <span class="px-2 py-0.5 rounded-md text-[10px] font-bold"
                                          :class="selectedYear === year ? 'bg-indigo-500/40 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-500 dark:text-gray-400'"
                                          x-text="countByYear(year)"></span>
                                </button>
                            </template>
                        </div>
                    </div>

                </aside>

                <!-- ========================================== -->
                <!-- STREAM KONTEN UTAMA (Kanan di Desktop)    -->
                <!-- ========================================== -->
                <div class="flex-grow w-full min-w-0">
                    
                    <!-- Indikator Pencarian/Filter Aktif (Jika ada) -->
                    <template x-if="search.length > 0 || selectedYear !== ''">
                        <div class="mb-4 px-4 sm:px-0 flex items-center justify-between text-xs text-gray-500 dark:text-gray-400">
                            <span>Hasil filter untuk: 
                                <strong class="text-indigo-600 dark:text-indigo-400" x-text="selectedYear ? 'Tahun ' + selectedYear : ''"></strong>
                                <strong class="text-indigo-600 dark:text-indigo-400" x-text="search ? ' &quot;' + search + '&quot;' : ''"></strong>
                            </span>
                            <button @click="selectedYear = ''; search = ''" class="text-xs text-red-500 hover:underline flex items-center gap-1">
                                <span class="icon-[ri--refresh-line] w-3 h-3"></span>
                                Reset Filter
                            </button>
                        </div>
                    </template>

                    <!-- Empty State Jika Hasil Cari / Filter Kosong -->
                    <template x-if="filteredGroupedJournals.length === 0">
                        <div class="text-center py-12 px-4 bg-gray-50 dark:bg-gray-800/40 rounded-2xl border border-dashed border-gray-200 dark:border-gray-700/80">
                            <span class="icon-[ri--file-search-line] w-10 h-10 mx-auto text-gray-300 dark:text-gray-600 mb-2 block"></span>
                            <p class="text-sm font-semibold text-gray-700 dark:text-gray-300">Tidak ada jurnal yang cocok</p>
                            <p class="text-xs text-gray-400 mt-1">Coba gunakan kata kunci lain atau ubah filter tahun.</p>
                        </div>
                    </template>

                    <!-- Daftar Jurnal Dikelompokkan per Bulan -->
                    <div class="flex flex-col gap-4 sm:gap-6 md:gap-8">
                        <template x-for="monthGroup in filteredGroupedJournals" :key="monthGroup.month">
                            <div class="bg-gray-50/50 dark:bg-gray-800/20 sm:bg-gray-50/60 sm:dark:bg-gray-800/30 p-0 sm:p-5 md:p-6 sm:rounded-2xl border-y sm:border border-gray-100 dark:border-gray-800">
                                
                                <!-- Header Bulan -->
                                <h3 class="px-4 sm:px-0 pt-3 sm:pt-0 text-xs md:text-sm font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider mb-2 sm:mb-4 pb-2 border-b border-gray-200/80 dark:border-gray-700/80 flex items-center justify-between" 
                                    x-text="monthGroup.month">
                                </h3>

                                <!-- Item List (Full Width di Mobile, Card Modern di Desktop) -->
                                <div class="divide-y divide-gray-100 dark:divide-gray-800/80">
                                    <template x-for="item in monthGroup.items" :key="item.permalink">
                                        <a :href="item.permalink" 
                                           class="group flex items-center gap-3 sm:gap-5 py-3 px-4 sm:px-4 sm:rounded-xl hover:bg-white dark:hover:bg-gray-800 transition-all hover:shadow-xs active:bg-gray-100 dark:active:bg-gray-800">
                                            
                                            <!-- Tanggal & Hari -->
                                            <div class="flex-shrink-0 text-center font-mono w-9 sm:w-12 py-1 rounded-md sm:rounded-lg bg-white dark:bg-gray-800 border border-gray-200/60 dark:border-gray-700/60 shadow-2xs">
                                                <span class="block text-sm sm:text-lg font-black text-gray-900 dark:text-white leading-none" x-text="item.day"></span>
                                                <span class="block text-[8px] sm:text-[10px] text-gray-400 uppercase font-bold mt-0.5" x-text="item.dayName"></span>
                                            </div>

                                            <!-- Judul -->
                                            <div class="flex-grow min-w-0">
                                                <h2 class="text-xs sm:text-sm md:text-base font-semibold md:font-bold text-gray-900 dark:text-white group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors line-clamp-2 md:line-clamp-1 leading-snug" 
                                                    x-text="item.title">
                                                </h2>
                                            </div>

                                            <!-- Badge Draft -->
                                            <template x-if="item.draft">
                                                <span class="flex-shrink-0 px-1.5 py-0.5 rounded text-[9px] font-bold bg-red-100 text-red-600 dark:bg-red-900/40 dark:text-red-400 border border-red-200 dark:border-red-800">DRAFT</span>
                                            </template>

                                            <!-- Panah Indikator -->
                                            <div class="flex-shrink-0 text-gray-300 dark:text-gray-600 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 group-hover:translate-x-1 transition-all">
                                                <span class="icon-[ri--arrow-right-s-line] w-4 h-4 sm:w-5 sm:h-5"></span>
                                            </div>
                                        </a>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>

                </div>

            </div>
        </div>
    </main>

    <!-- Script Logika Alpine.js -->
<script>
    function journalApp() {
        return {
            journals: [],
            loading: true,
            search: '',
            selectedYear: '',
            
            async initData() {
                // 1. Baca parameter dari URL saat halaman pertama kali dibuka/di-refresh
                const urlParams = new URLSearchParams(window.location.search);
                this.search = urlParams.get('q') || '';
                this.selectedYear = urlParams.get('year') || '';

                // 2. Pasang observer ($watch) untuk meng-update URL setiap kali state berubah
                this.$watch('search', () => this.updateURL());
                this.$watch('selectedYear', () => this.updateURL());

                try {
                    // Delay buatan 800ms agar skeleton terlihat
                    await new Promise(resolve => setTimeout(resolve, 600));

                    let response = await fetch('{{ "journal/index.json" | relURL }}');
                    this.journals = await response.json();
                } catch (error) {
                    console.error('Gagal meload data jurnal:', error);
                } finally {
                    this.loading = false;
                }
            },

            // Method untuk memperbarui query string di URL tanpa reload halaman
            updateURL() {
                const params = new URLSearchParams();

                if (this.selectedYear) {
                    params.set('year', this.selectedYear);
                }
                if (this.search.trim() !== '') {
                    params.set('q', this.search.trim());
                }

                // Buat URL baru
                const newQuery = params.toString();
                const newURL = newQuery 
                    ? `${window.location.pathname}?${newQuery}` 
                    : window.location.pathname;

                // Update URL di browser history
                window.history.replaceState({}, '', newURL);
            },

            get availableYears() {
                let years = this.journals.map(j => j.year);
                return [...new Set(years)].sort((a, b) => b - a);
            },

            countByYear(year) {
                return this.journals.filter(j => j.year === year).length;
            },

            get filteredGroupedJournals() {
                let filtered = this.journals.filter(j => {
                    let matchesYear = this.selectedYear === '' || String(j.year) === String(this.selectedYear);
                    let matchesSearch = this.search === '' || j.title.toLowerCase().includes(this.search.toLowerCase());
                    return matchesYear && matchesSearch;
                });

                let groups = {};
                filtered.forEach(j => {
                    if (!groups[j.month]) {
                        groups[j.month] = [];
                    }
                    groups[j.month].push(j);
                });

                return Object.keys(groups).map(month => {
                    return {
                        month: month,
                        items: groups[month]
                    };
                });
            }
        }
    }
</script>
{{ end }}
