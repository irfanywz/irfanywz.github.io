{{ define "head" }}
{{ end }}

{{ define "main" }}
<main class="flex-grow bg-white dark:bg-gray-900 transition-colors duration-300">
    <section class="py-16">
        <div class="container max-w-4xl mx-auto px-4">
            <div class="flex flex-col md:flex-row items-center gap-8 md:gap-12 bg-gray-50 dark:bg-gray-800/50 p-8 rounded-3xl border border-gray-200 dark:border-gray-700">
                {{ if .Params.profile_picture }}
                <div class="flex-shrink-0">
                    <img src="{{ .Params.profile_picture | relURL }}" alt="Foto Profil {{ .Site.Title }}" class="w-48 h-48 rounded-full object-cover shadow-lg border-4 border-white dark:border-gray-800">
                </div>
                {{ end }}
                <div class="text-center md:text-left">
                    <h1 class="text-4xl font-bold text-gray-900 dark:text-white mb-4">
                        {{ .Title }}
                    </h1>
                    <p class="text-xl text-gray-600 dark:text-gray-400">{{ .Description }}</p>
                    <div class="flex flex-wrap justify-center md:justify-start gap-3 mt-6">
                        {{ with .Site.GetPage "/contact.md" }}
                            {{ $wa := .Params.whatsapp }}
                            <a href="{{ $wa }}" target="_blank" class="inline-flex items-center justify-center w-10 h-10 bg-green-100 text-green-600 rounded-full hover:bg-green-200 dark:bg-green-900/30 dark:text-green-400 dark:hover:bg-green-900/50 transition-colors" title="Whatsapp">
                                <span class="icon-[ri--whatsapp-line] w-5 h-5"></span>
                            </a>
                        {{ end }}
                        <a href="{{ "/support/" | relURL }}" class="inline-flex items-center justify-center w-10 h-10 bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 border border-red-100 dark:border-red-800 rounded-full hover:bg-red-100 dark:hover:bg-red-900/50 transition-colors shadow-sm" title="Beri dukungan">
                            <span class="icon-[ri--cup-line] text-red-500 w-5 h-5 animate-pulse"></span>
                        </a>
                    </div>
                </div>
            </div>

            <div class="prose prose-lg dark:prose-invert max-w-none mx-auto mt-12">
                 {{ .Content }}
            </div>
        </div>
    </section>    
</main>
{{ end }}
