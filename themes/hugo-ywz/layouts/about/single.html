{{ define "head" }}
{{ end }}

{{ define "main" }}
<main class="flex-grow bg-slate-50/60 dark:bg-gray-950 transition-colors duration-300" 
    x-data="{ 
        activeTab: 'kenalan',
        scrollToSection() {
            this.$nextTick(() => {
                const el = document.getElementById('support-section');
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        },
        init() {
            const hash = window.location.hash.replace('#', '');
            if (['kenalan', 'support', 'portofolio'].includes(hash)) {
                this.activeTab = hash;
                if (hash === 'support') {
                    this.scrollToSection();
                }
            }
            
            this.$watch('activeTab', value => {
                history.replaceState(null, null, '#' + value);
                if (value === 'support') {
                    this.scrollToSection();
                }
            });
        }
    }">
    
    <section class="py-12 sm:py-16 relative overflow-hidden">
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-indigo-500/10 dark:bg-indigo-900/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="container max-w-4xl mx-auto px-4 relative z-10">
            
            <div class="bg-white dark:bg-gray-900 rounded-3xl border border-slate-200/80 dark:border-gray-800 shadow-xl shadow-slate-200/50 dark:shadow-none overflow-hidden">
                
                <!-- 1. HERO HEADER AREA -->
                <div class="p-6 sm:p-10 flex flex-col md:flex-row items-center gap-6 sm:gap-10">
                    
                    {{ if .Params.profile_picture }}
                    <div class="relative flex-shrink-0 group">
                        <div class="absolute -inset-0.5 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full blur opacity-50 group-hover:opacity-75 transition duration-300"></div>
                        <img src="{{ .Params.profile_picture | relURL }}" alt="Foto Profil {{ .Site.Title }}" class="relative w-36 h-36 sm:w-44 sm:h-44 rounded-full object-cover shadow-inner border-4 border-white dark:border-gray-900">
                    </div>
                    {{ end }}

                    <div class="text-center md:text-left flex-grow">
                        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900 dark:text-white mb-2">
                            {{ .Title }}
                        </h1>
                        
                        <p class="text-sm sm:text-base text-slate-600 dark:text-gray-400 italic mb-6 leading-relaxed">
                            "{{ .Description }}"
                        </p>

                        <!-- Navigasi Tab -->
                        <div class="flex flex-wrap justify-center md:justify-start items-center gap-2 border-t border-slate-100 dark:border-gray-800 pt-4">
                            
                            <button @click="activeTab = 'kenalan'" 
                                :class="activeTab === 'kenalan' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-gray-800 text-slate-700 dark:text-gray-300 hover:bg-slate-200 dark:hover:bg-gray-700'"
                                class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all">
                                <span class="icon-[ri--user-smile-line] w-4 h-4"></span>
                                <span>{{ with .Params.tabs }}{{ .tab_kenalan }}{{ else }}Kenalan{{ end }}</span>
                            </button>

                            <button @click="activeTab = 'support'" 
                                :class="activeTab === 'support' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-gray-800 text-slate-700 dark:text-gray-300 hover:bg-slate-200 dark:hover:bg-gray-700'"
                                class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all">
                                <span class="icon-[ri--heart-3-line] w-4 h-4 text-red-400"></span>
                                <span>{{ with .Params.tabs }}{{ .tab_support }}{{ else }}Support{{ end }}</span>
                            </button>

                            <button @click="activeTab = 'portofolio'" 
                                :class="activeTab === 'portofolio' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-gray-800 text-slate-700 dark:text-gray-300 hover:bg-slate-200 dark:hover:bg-gray-700'"
                                class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all">
                                <span class="icon-[ri--briefcase-line] w-4 h-4 text-cyan-400"></span>
                                <span>{{ with .Params.tabs }}{{ .tab_portofolio }}{{ else }}Portofolio{{ end }}</span>
                            </button>

                        </div>
                    </div>

                </div>

                <!-- 2. AREA KONTEN TAB (PARTIALS) -->
                <div class="border-t border-slate-100 dark:border-gray-800">
                    
                    {{ partial "about/tab-kenalan.html" . }}
                    {{ partial "about/tab-support.html" . }}
                    {{ partial "about/tab-portofolio.html" . }}

                </div>

            </div>

        </div>
    </section>    

</main>
{{ end }}
