{{ define "main" }}
<main class="flex-grow bg-white dark:bg-gray-900 transition-colors duration-300">
    <!-- Breadcrumb Simple Saja -->
    <div class="container max-w-6xl mx-auto px-4 pt-6">
        <nav class="flex items-center flex-wrap gap-2 text-sm text-gray-500 dark:text-gray-400">
                
            {{ with .CurrentSection }}
                {{ if ne .RelPermalink "/" }}
                <a href="{{ .RelPermalink }}" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">{{ .Title }}</a>
                <span class="text-gray-300 dark:text-gray-700">/</span>
                {{ end }}
            {{ end }}

            <span class="text-gray-900 dark:text-white font-medium truncate max-w-xs sm:max-w-md" title="{{ .Title }}">{{ .Title }}</span>
        </nav>
    </div>

    <!-- Layout utama post (yang sudah ada header judul & .Content-nya) -->
    {{ $layout := .Params.layout | default "default" }}
    {{ partial (printf "collection/layouts/%s.html" $layout) . }}
</main>
{{ end }}
