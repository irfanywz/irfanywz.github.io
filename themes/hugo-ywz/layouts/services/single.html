{{ define "main" }}
{{ $v := partial "services/vars.html" . }}
{{ $payQr := $v.payQr }}
<main class="w-full bg-gray-50 dark:bg-gray-900/50 transition-colors duration-300">
    <div class="max-w-6xl mx-auto px-4 py-8 md:py-12"
         x-data="productPurchase({
            product: {
                name: {{ .Title | jsonify }},
                type: {{ .Params.shop_type | jsonify }},
                variants: {{ .Params.variants | jsonify }},
                free: {{ if .Params.free }}true{{ else }}false{{ end }},
                payQr: {{ if $payQr }}true{{ else }}false{{ end }},
                price: {{ .Params.price | default 0 }}
            },
            contact: {
                wa: '{{ .CurrentSection.Params.contact_wa }}',
                telegram: '{{ .CurrentSection.Params.contact_telegram }}'
            }
         })">
        
        <div class="grid lg:grid-cols-12 gap-8 items-start">
            <!-- Left Column -->
            {{ partial "services/details.html" . }}

            <!-- Right Sidebar -->
            {{ partial "services/purchase-card.html" . }}
        </div>
    </div>
</main>

{{ partial "components/inline-bundle.html" (dict "src" "js/pages/services/single.js") }}
{{ end }}
