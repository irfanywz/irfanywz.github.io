baseURL = "https://irfanywz.web.id/"
theme = "hugo-ywz"
locale = "en-us"
title = "Muhamad Irfan"
copyright = "Muhamad Irfan"

enableEmoji = true
enableGitInfo = true
enableRobotsTXT = true
canonifyURLs = true

pagination.pagerSize = 2

pygmentsstyle = "vs"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true


[params]
  version = "2.1.0"
	# browser icon
  favicon = "favicon.ico"

	# Optional 64x64 avatar image.
	# avatar = "https://avatars.githubusercontent.com/u/117440754?v=4"
  avatar = "avatar.avif"

  author = "Muhamad Irfan"
  description = "Personal web Muhamad Irfan, menulis dan berbagi hal menarik seputar teknologi."
  keywords = "Muhamad Irfan, Content Creator Indonesia, YouTube Automation, Creator Tools, Digital Storytelling, muhamadirfan300899, Promise ETY, Bogor, Video Strategist, Personal Blog, sedang mempelajari bangun channel youtube yang menghasilkan, dengan harapan tahun ini bisa terkumpul 3 digit 000 xixixix"

