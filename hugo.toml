[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = false
    style = "dracula"  # or any other chroma style
    tabWidth = 2

[taxonomies]
  # tag = 'tags'
  topic = "topics"

[permalinks]
  posts = "/:slug/"

# allow html to content .md
[markup.goldmark.renderer] 
	unsafe= true

# allow shortcodes
[security]
	enableInlineShortcodes = true	

# output format
[outputs]
  home = ["HTML", "JSON", "RSS"]  
  section = ["HTML"] #force section only generate HTML not with RSS

[outputFormats] 
[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true    

[languages.id]
label = "Indonesian"
locale = "id"

[services]
  [services.googleAnalytics]
    id = 'G-VVGW3VPZZG'