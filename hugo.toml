baseURL = "https://irfanywz.web.id/"
theme = "hugo-ywz"
locale = "en-us"
title = "Personal blog Muhamad Irfan"
copyright = "Muhamad Irfan"

enableEmoji = true
enableGitInfo = true
enableRobotsTXT = true
canonifyURLs = true

pagination.pagerSize = 4

pygmentsstyle = "vs"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

[params]
  # title for seo
  title = "irfanywz"
  address = "irfanywz.web.id"


	# browser icon
  favicon = "favicon.ico"

	# Optional 64x64 avatar image.
	# avatar = "https://avatars.githubusercontent.com/u/117440754?v=4"
  avatar = "avatar.avif"
  logo = "logo.avif"
  logoText = "logo-text.avif"

  author = "Muhamad Irfan"
  description = "Personal blog Muhamad Irfan, menulis dan berbagi hal menarik seputar teknologi."
  keywords = "Muhamad Irfan, Konten kreator pemula, lagi belajar Storytelling, muhamadirfan300899, Bogor, Personal Blog"

  # ads on post
  showAds = false 
  adInterval = 4
  adCode = '''
    <div class="w-full">
        <span class="block text-xs font-semibold tracking-wider text-gray-400 uppercase mb-2">Advertisement</span>
        <div class="text-sm text-gray-500 dark:text-gray-400">
            <!-- Contoh jika pakai script AdSense atau banner kustom -->
            <span>-- Slot Iklan Global dari Confige --</span>
        </div>
    </div>
  '''

  # categories sidebar
  showCategories = true

  # ads sidebar
  showAdsSidebar = false
  adCodeSidebar = '''
    <div class="w-full">
        <span class="block text-xs font-semibold tracking-wider text-gray-400 uppercase mb-2">Advertisement</span>
        <div class="text-sm text-gray-500 dark:text-gray-400">
            <!-- Contoh jika pakai script AdSense atau banner kustom -->
            <span>-- Slot Iklan Global dari Config --</span>
        </div>
    </div>
  '''

  # Exit Popup
  exitIntentTitle = "Tunggu, Jangan Pergi"
  exitIntentContent = "Terima kasih telah mampir keblog ini"


