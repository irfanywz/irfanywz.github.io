# Menjalankan tes JS otomatis setiap push/PR. Terpisah dari deploy: kalau gagal, situs tetap ter-deploy,
# tapi tanda merah muncul di tab Actions / di samping commit.
name: Test JS

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
